<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2e4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rohub">
  <title>Rohub</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/">
      <img src="/favicon.svg" alt="" width="30" height="30">
      <span class="brand-text">Rohub</span>
    </a>
    <nav class="topnav" id="topnav" aria-label="Hovedmenu"></nav>
    <div class="userbox">
      <button class="icon-btn bell" id="bell" type="button" aria-label="Notifikationer"></button>
      <span class="role-badge" id="roleBadge"></span>
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <span class="user-name" id="userName"></span>
      <button class="btn ghost small" id="logoutBtn" type="button">Log ud</button>
    </div>
  </header>
  <main id="app" class="container" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" aria-label="Menu" hidden></nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/shared/formula.js"></script>
  <script src="/shared/diff.js"></script>
  <script src="/icons.js"></script>
  <script src="/markdown.js"></script>
  <script src="/formulas.js"></script>
  <script src="/books.js"></script>
  <script src="/legal.js"></script>
  <script src="/assistant.js"></script>
  <script src="/admin.js"></script>
  <script src="/studio.js"></script>
  <script src="/dashboard.js"></script>
  <script src="/app.js"></script>
</body>
</html>
