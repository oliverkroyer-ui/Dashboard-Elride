<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Rohub</title>
<style>
:root {
  --navy: #0b2e4f;
  --navy-2: #134a7a;
  --gold: #f2c14e;
  --bg: #f3f5f8;
  --card: #ffffff;
  --text: #1b2430;
  --muted: #5d6b7c;
  --line: #dde3ea;
  --ok: #2a7f62;
  --warn: #b7791f;
  --bad: #b23a48;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(11, 46, 79, .06), 0 4px 14px rgba(11, 46, 79, .06);
  --accent: var(--navy-2);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
}
a { color: var(--navy-2); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .75rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

/* Topbar */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
  background: var(--navy); color: #fff; padding: .6rem 1.25rem;
}
.brand { display: flex; align-items: center; gap: .6rem; color: #fff; text-decoration: none; font-weight: 700; }
.topnav { display: flex; gap: .25rem; flex: 1; flex-wrap: wrap; }
.topnav a { color: #d6e2ee; text-decoration: none; padding: .35rem .7rem; border-radius: 6px; }
.topnav a:hover, .topnav a.active { background: rgba(255,255,255,.12); color: #fff; }
.userbox { display: flex; align-items: center; gap: .6rem; font-size: .9rem; }
.role-badge { background: var(--gold); color: var(--navy); font-weight: 700; font-size: .75rem; padding: .15rem .5rem; border-radius: 99px; text-transform: uppercase; letter-spacing: .03em; }

.container { max-width: 1150px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

/* Cards & grids */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.1rem 1.2rem; }
.grid { display: grid; gap: 1rem; }
.grid.subjects { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 800px) { .grid.two { grid-template-columns: 1fr; } }
.stack > * + * { margin-top: .75rem; }

.subject-card { display: block; text-decoration: none; color: inherit; border-top: 5px solid var(--accent); transition: transform .1s ease, box-shadow .1s ease; }
.subject-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(11,46,79,.12); }
.subject-card .code { font-weight: 800; font-size: .75rem; letter-spacing: .08em; color: var(--accent); }
.subject-card h3 { margin-top: .2rem; }
.subject-card .meta { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }

.pill { display: inline-block; font-size: .78rem; padding: .12rem .55rem; border-radius: 99px; background: #eef2f6; color: var(--muted); }
.pill.warn { background: #fdf3e1; color: var(--warn); }
.pill.ok { background: #e3f3ec; color: var(--ok); }
.pill.bad { background: #f9e5e8; color: var(--bad); }

.hero {
  background: linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff;
  border-radius: var(--radius); padding: 1.4rem 1.5rem; margin-bottom: 1.25rem;
}
.hero p { color: #d6e2ee; margin: 0; }
.subject-hero { background: var(--accent); }

.section-title { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 1.5rem 0 .75rem; }
.section-title h2 { margin: 0; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: .7rem 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
.empty { color: var(--muted); font-style: italic; }

/* Tabs */
.tabs { display: flex; gap: .25rem; border-bottom: 2px solid var(--line); margin-bottom: 1rem; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: .6rem 1rem; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

/* Forms */
form.form { display: grid; gap: .7rem; }
label { display: grid; gap: .25rem; font-weight: 600; font-size: .88rem; }
input, textarea, select {
  font: inherit; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--text); width: 100%;
}
textarea { min-height: 110px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--navy-2); outline-offset: 1px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  font: inherit; font-weight: 600; padding: .5rem 1rem; border-radius: 7px; border: 1px solid transparent;
  background: var(--navy-2); color: #fff; cursor: pointer; text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: currentColor; color: inherit; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.small { padding: .25rem .6rem; font-size: .82rem; }
.btn[disabled] { opacity: .5; cursor: default; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; }
details.creator > summary { cursor: pointer; font-weight: 600; color: var(--navy-2); list-style: none; }
details.creator > summary::-webkit-details-marker { display: none; }
details.creator[open] > summary { margin-bottom: .75rem; }

/* Login */
.login-wrap { min-height: 90vh; display: grid; place-items: center; }
.login-card { width: min(430px, 100%); }
.login-card .logo { display: flex; align-items: center; gap: .7rem; margin-bottom: 1rem; }
.login-card .logo h1 { font-size: 1.25rem; margin: 0; }
.role-switch { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: .5rem; }
.role-switch button { padding: .6rem; border: 1px solid var(--line); background: #fff; border-radius: 7px; font: inherit; cursor: pointer; }
.role-switch button.active { border-color: var(--navy-2); background: #eaf1f8; font-weight: 700; }
.demo { margin-top: 1rem; font-size: .82rem; color: var(--muted); background: #f6f8fa; padding: .6rem .8rem; border-radius: 7px; }
.error { color: var(--bad); font-size: .9rem; min-height: 1.2em; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: #f6f8fa; font-weight: 600; white-space: nowrap; }
td.grade { font-weight: 700; text-align: center; }

.submission-text { white-space: pre-wrap; background: #f6f8fa; border-radius: 7px; padding: .6rem .8rem; margin: .5rem 0; }
.grade-big { font-size: 1.6rem; font-weight: 800; color: var(--navy); }
.prewrap { white-space: pre-wrap; }

.toast {
  position: fixed; right: 1rem; bottom: 1rem; background: var(--navy); color: #fff;
  padding: .7rem 1rem; border-radius: 8px; box-shadow: var(--shadow); max-width: 360px;
}
.toast.error { background: var(--bad); }

[hidden] { display: none !important; }
label { align-content: start; }
.card > h2:not(:first-child) { margin-top: 1.25rem; }
.center { text-align: center; }
.bullets { margin: 0; padding-left: 1.2rem; }
.bullets li { margin: .2rem 0; }
.spaced { margin-top: 1.5rem; }

.badge { display: inline-block; min-width: 1.3em; margin-left: .35rem; padding: 0 .4rem; border-radius: 99px; background: var(--gold); color: var(--navy); font-size: .75rem; font-weight: 800; text-align: center; }
.grid.three { display: grid; gap: .7rem; grid-template-columns: repeat(3, 1fr); }
.lesson { border-left: 4px solid var(--accent); padding-left: .7rem !important; margin: .4rem 0; border-bottom: 0 !important; }
.week { display: grid; gap: .8rem; grid-template-columns: repeat(5, 1fr); }
.week .day.today { outline: 2px solid var(--gold); }
.week .day h3 { display: flex; justify-content: space-between; align-items: center; }
@media (max-width: 900px) { .week { grid-template-columns: 1fr; } .grid.three { grid-template-columns: 1fr; } }
.msg-layout { display: grid; gap: 1rem; grid-template-columns: 300px 1fr; align-items: start; }
@media (max-width: 800px) { .msg-layout { grid-template-columns: 1fr; } }
.threads li { padding: 0; }
.threads li.selected { background: #eaf1f8; border-radius: 7px; }
.thread { display: block; padding: .6rem .5rem; color: inherit; text-decoration: none; }
.convo { display: grid; gap: .8rem; }
.messages { display: flex; flex-direction: column; gap: .5rem; max-height: 55vh; overflow-y: auto; padding: .5rem; background: #f6f8fa; border-radius: 8px; }
.msg { max-width: 75%; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: .5rem .75rem; align-self: flex-start; }
.msg.mine { align-self: flex-end; background: var(--navy-2); color: #fff; border-color: var(--navy-2); }
.msg .meta { opacity: .7; margin-top: .2rem; }
.compose textarea { min-height: 70px; }

/* ===================== App-skal ===================== */
html { -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; }
.icon { flex: none; vertical-align: -0.2em; }
.btn .icon, .pill .icon { margin-right: .1rem; }
.topbar { padding-top: max(.6rem, env(safe-area-inset-top, 0px)); padding-left: max(1.25rem, env(safe-area-inset-left, 0px)); padding-right: max(1.25rem, env(safe-area-inset-right, 0px)); }
.topnav a { display: inline-flex; align-items: center; gap: .4rem; }
.avatar { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--gold); color: var(--navy); font-weight: 800; font-size: .8rem; }
#app { animation: page-in .18s ease-out; }
@keyframes page-in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #app { animation: none; } .subject-card, .book-cover { transition: none; } }
.tabbar { display: none; }
@media (max-width: 860px) {
  .topnav, .user-name { display: none; }
  .topbar { justify-content: space-between; }
  .userbox { margin-left: auto; }
  body.signed-in .container { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px)); }
  .tabbar { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around;
    background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(11,46,79,.06);
    padding: .35rem max(.25rem, env(safe-area-inset-right, 0px)) calc(.35rem + env(safe-area-inset-bottom, 0px)) max(.25rem, env(safe-area-inset-left, 0px)); }
  .tabbar[hidden] { display: none; }
  .tabbar a { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .3rem .1rem;
    color: var(--muted); text-decoration: none; font-size: .68rem; font-weight: 600; border-radius: 10px; min-width: 0; }
  .tabbar a span:not(.badge) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tabbar a.active { color: var(--navy-2); background: #eaf1f8; }
  .tabbar .badge { position: absolute; top: 0; right: calc(50% - 22px); margin: 0; }
  .toast { bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); left: 1rem; right: 1rem; max-width: none; }
  .hero { padding: 1.1rem 1.1rem; }
  h1 { font-size: 1.35rem; }
}
.btn.on-dark { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.4); color: #fff; }
.hero-back { color: #fff; }
.code { font-weight: 800; font-size: .75rem; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
.edit-form { border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(19,74,122,.12); }

/* ===================== Lærebøger ===================== */
.grid.books { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.book { display: flex; flex-direction: column; gap: .5rem; }
.book-cover { display: flex; min-height: 190px; background: var(--card); border: 1px solid var(--line); border-radius: 6px 12px 12px 6px;
  box-shadow: var(--shadow); text-decoration: none; color: inherit; overflow: hidden; transition: transform .12s ease, box-shadow .12s ease; }
.book-cover:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(11,46,79,.14); }
.book-spine { width: 16px; flex: none; background: linear-gradient(90deg, rgba(0,0,0,.18), transparent 60%), var(--accent); }
.book-body { padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
.book-body h3 { font-size: 1.08rem; margin: 0; }
.book-body .meta { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: auto; padding-top: .4rem; }
.book-actions { display: flex; gap: .5rem; }
.progress { height: 6px; background: #e6ebf1; border-radius: 99px; overflow: hidden; min-width: 60px; }
.progress span { display: block; height: 100%; background: var(--ok); border-radius: 99px; }

.reader-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 1.25rem; align-items: start; }
@media (max-width: 860px) { .reader-layout { grid-template-columns: 1fr; } }
.toc { position: sticky; top: 5rem; display: grid; gap: .6rem; }
@media (max-width: 860px) { .toc { position: static; } }
.toc h2 { margin: 0; }
.toc-list { list-style: none; counter-reset: ch; margin: 0; padding: 0; display: grid; gap: .15rem; }
.toc-list li { counter-increment: ch; }
.toc-list a { display: flex; align-items: center; gap: .5rem; padding: .45rem .55rem; border-radius: 7px; color: var(--text); text-decoration: none; font-size: .92rem; }
.toc-list a::before { content: counter(ch); flex: none; width: 1.5rem; height: 1.5rem; display: grid; place-items: center; border-radius: 50%; background: #eef2f6; color: var(--muted); font-size: .75rem; font-weight: 700; }
.toc-list a span:first-of-type { flex: 1; min-width: 0; }
.toc-list li.current a { background: #eaf1f8; font-weight: 600; }
.toc-list li.current a::before { background: var(--accent); color: #fff; }
.toc-check { color: var(--ok); display: inline-flex; }
.reader { border-top: 5px solid var(--accent); padding: 1.5rem clamp(1.1rem, 4vw, 2.5rem); }
.reader > h1 { font-size: 1.9rem; margin-top: .3rem; text-wrap: balance; }
.lead { font-size: 1.1rem; color: var(--muted); }
.reader-nav { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }

.md { font-size: 1.02rem; line-height: 1.7; max-width: 68ch; }
.md h2, .md h3, .md h4, .md h5 { margin: 1.6rem 0 .5rem; }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md .table-wrap { margin: 0 0 1rem; }
.md ul, .md ol { padding-left: 1.4rem; }
.md li { margin: .25rem 0; }
.md blockquote { border-left: 4px solid var(--gold); background: #fdf8ea; padding: .6rem .9rem; border-radius: 0 8px 8px 0; }
.md code { background: #eef2f6; padding: .1rem .35rem; border-radius: 4px; font-size: .9em; }
.md pre { background: var(--navy); color: #e8eef5; padding: .9rem 1rem; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; color: inherit; }
.md img { max-width: 100%; border-radius: 8px; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.5rem 0; }
.md table { font-size: .95rem; }

/* Bog-editor */
.editor-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 860px) { .editor-grid { grid-template-columns: 1fr; } }
.chapter-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.chapter-row { display: flex; align-items: center; gap: .75rem; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 9px; flex-wrap: wrap; }
.chapter-order { display: flex; flex-direction: column; gap: 2px; }
.chapter-info { flex: 1; min-width: 160px; }
.chapter-info a { color: var(--text); text-decoration: none; }
.icon-btn { display: grid; place-items: center; width: 28px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); cursor: pointer; padding: 0; }
.icon-btn[disabled] { opacity: .3; cursor: default; }
.inline-form { display: flex; gap: .5rem; flex-wrap: wrap; }
.inline-form input { flex: 1; min-width: 180px; }
.danger-zone { border-color: #efd0d5; }

/* Kapitel-editor */
.editor-head { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin: .5rem 0 1rem; }
.title-input { flex: 1; min-width: 220px; font-size: 1.4rem; font-weight: 700; border: 1px solid transparent; background: transparent; padding: .3rem .5rem; }
.title-input:hover, .title-input:focus { border-color: var(--line); background: #fff; }
.save-status.unsaved { color: var(--warn); font-weight: 600; }
.md-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
.md-pane { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 60vh; overflow: hidden; }
.md-toolbar { display: flex; flex-wrap: wrap; gap: .25rem; padding: .45rem; border-bottom: 1px solid var(--line); background: #f6f8fa; }
.md-toolbar button { font: inherit; font-size: .82rem; font-weight: 700; min-width: 34px; padding: .3rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; color: var(--text); }
.md-toolbar button:hover { border-color: var(--navy-2); color: var(--navy-2); }
.md-input { flex: 1; border: 0; border-radius: 0; resize: none; min-height: 55vh; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92rem; line-height: 1.6; padding: 1rem; }
.md-input:focus { outline: none; }
.preview-pane { padding: 1rem 1.4rem; overflow-y: auto; max-height: 75vh; }
.mode-tabs { display: none; }
@media (max-width: 860px) {
  .mode-tabs { display: flex; }
  .md-split { grid-template-columns: 1fr; }
  .md-split.show-write .preview-pane, .md-split.show-preview .md-pane:not(.preview-pane) { display: none; }
}
.editor-foot { margin-top: .6rem; flex-wrap: wrap; }
.history { margin-top: 1rem; }
.history > summary { cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: .4rem; }
.revision-view { background: #fbfcfd; }

/* ===================== Lærerstudio ===================== */
.studio-hero { background: linear-gradient(120deg, #0b2e4f 0%, #134a7a 70%, #1d6f7a 100%); }
.studio-badge { display: inline-flex; align-items: center; gap: .4rem; background: rgba(255,255,255,.14); padding: .25rem .7rem; border-radius: 99px; font-size: .8rem; font-weight: 700; margin-bottom: .6rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; text-decoration: none; color: inherit; }
a.stat:hover { border-color: var(--navy-2); }
.stat-value { font-size: 1.7rem; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-label { font-weight: 600; }
.studio-table td { vertical-align: middle; }
.studio-table td.num { font-variant-numeric: tabular-nums; }
.studio-table .progress { width: 80px; display: inline-block; vertical-align: middle; margin-right: .4rem; }
.subject-edit { border-left: 5px solid var(--accent); }
.subject-edit h3 { margin: .1rem 0 0; }
.activity li { padding: .55rem 0; }
.studio-card { display: flex; gap: .9rem; align-items: center; text-decoration: none; color: inherit; border-left: 5px solid var(--gold); }
.studio-card .icon { color: var(--navy-2); }
.reading-item { display: grid; gap: .35rem; color: inherit; text-decoration: none; }
input[type=color] { padding: .2rem; height: 2.5rem; }
.role-switch button { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
.pill { white-space: nowrap; }
.actions { align-items: center; }
form.inline-form { display: flex; }
label input, label textarea, label select { font-weight: 400; }

/* ===================== Intelligent portal (v3) ===================== */
.pill.info { background: #e6f0fa; color: #134a7a; }
.pill.new { background: var(--gold); color: var(--navy); font-weight: 700; }
.pill.version { background: var(--navy); color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
a.pill { text-decoration: none; }
.btn.accent { background: #c9861a; }
.btn.big { padding: .8rem 1.4rem; font-size: 1.05rem; width: 100%; }
.row.gap { justify-content: flex-start; gap: .6rem; align-items: center; }
.bell { position: relative; background: transparent; border: 0; color: #fff; width: 36px; height: 36px; }
.bell .badge { position: absolute; top: -2px; right: -4px; margin: 0; }
.notice { display: flex; gap: .7rem; align-items: flex-start; }
.notice.small { font-size: .88rem; padding: .5rem .7rem; border-radius: 8px; background: #f2f6fa; margin-bottom: .6rem; align-items: center; }
.card.notice.ok, .notice.ok { background: #eef8f3; border-color: #cfe9dc; }
.card.notice.warn, .notice.warn { background: #fdf6e7; border-color: #f1dfb4; }
.card.notice.bad { background: #fbeef0; border-color: #efcfd5; }

// ---------- Visning ----------
function fmtNum(n, decimals = 3) {
  if (!isFinite(n)) return '–';
  const d = Math.max(0, Math.min(10, decimals));
  let s = (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
  if (d > 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  if (s === '-0') s = '0';
  const [i, f] = s.split('.');
  const neg = i.startsWith('-');
  const digits = neg ? i.slice(1) : i;
  const grouped = digits.length > 4 ? digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : digits;

function parseNum(s) {
  if (typeof s === 'number') return s;
  const t = String(s || '').trim().replace(/\s/g, '').replace(/−/g, '-');
  if (!t) return NaN;
  const norm = /,/.test(t) ? t.replace(/\./g, '').replace(',', '.') : t;

const PREC = { '<': 0, '>': 0, '<=': 0, '>=': 0, '+': 1, '-': 1, '*': 2, '/': 2, '^': 4 };
const OPSHOW = { '*': ' · ', '/': ' / ', '+': ' + ', '-': ' − ', '^': '^', '<': ' < ', '>': ' > ', '<=': ' ≤ ', '>=': ' ≥ ' };
// leaf(n) bestemmer hvordan en variabel vises (symbol eller indsat værdi)
function show(ast, leaf, parentPrec = -1, rightSide = false) {
  let s, prec = 9;
  switch (ast.t) {
    case 'num': s = fmtNum(ast.v, 6); break;
    case 'const': s = 'π'; break;
    case 'var': s = leaf(ast.n); break;
    case 'paren': s = '(' + show(ast.a, leaf) + ')'; break;
    case 'neg': s = '−' + show(ast.a, leaf, 3); prec = 3; break;
    case 'call': s = (ast.f === 'sqrt' ? '√' : ast.f) + '(' + ast.args.map((x) => show(x, leaf)).join('; ') + ')'; break;
    case 'bin':

      s = show(ast.a, leaf, prec, false) + OPSHOW[ast.op] + show(ast.b, leaf, prec, true);

// Mellemregninger: symbolsk → indsatte værdier → delresultater → resultat
function steps(formula, vals) {
  const ast = parse(formula.expression);
  const vars = Object.fromEntries((formula.variables || []).map((v) => [v.symbol, v]));
  const label = (n) => (vars[n] && vars[n].display) || n;
  const unit = (n) => unitSuffix(vars[n] && vars[n].unit);
  const res = formula.result || {};
  const lhs = res.display || res.symbol || 'Resultat';
  const out = [];
  out.push({ kind: 'formel', text: `${lhs} = ${show(ast, label)}` });
  out.push({ kind: 'indsat', text: `${lhs} = ${show(ast, (n) => fmtNum(vals[n], 6) + unit(n))}` });
  // delresultater: evaluer de største deludtryk under roden
  const partial = (node) => {
    if (node.t === 'bin') {
      const sides = [node.a, node.b].map((x) => (x.t === 'num' || x.t === 'var' || x.t === 'const' ? x : { t: 'num', v: evaluate(x, vals) }));
      return { ...node, a: sides[0], b: sides[1] };
    }
    if (node.t === 'paren') return partial(node.a);
    if (node.t === 'call') return { ...node, args: node.args.map((x) => (x.t === 'num' ? x : { t: 'num', v: evaluate(x, vals) })) };
    if (node.t === 'neg') return { t: 'neg', a: { t: 'num', v: evaluate(node.a, vals) } };

  };

  if (mid !== show(ast, (n) => fmtNum(vals[n], 6)) && mid !== fmtNum(value, 6)) out.push({ kind: 'mellem', text: `${lhs} = ${mid}` });
  out.push({ kind: 'resultat', text: final });

// Beregn med kontrol af input og advarsler
function calculate(formula, rawInputs) {
  const vals = {}, problems = [];
  for (const v of formula.variables || []) {
    const n = parseNum(rawInputs[v.symbol]);
    if (isNaN(n)) { problems.push({ level: 'fejl', symbol: v.symbol, text: `Skriv et tal for ${v.label || v.symbol}` }); continue; }
    if (v.min != null && n < v.min) problems.push({ level: 'advarsel', symbol: v.symbol, text: `${v.label || v.symbol} er usædvanligt lav (under ${fmtNum(v.min)} ${v.unit || ''})` });
    if (v.max != null && n > v.max) problems.push({ level: 'advarsel', symbol: v.symbol, text: `${v.label || v.symbol} er usædvanligt høj (over ${fmtNum(v.max)} ${v.unit || ''})` });
    vals[v.symbol] = n;
  }
  if (problems.some((p) => p.level === 'fejl')) return { ok: false, problems };

    const r = steps(formula, vals);
    if (!isFinite(r.value)) return { ok: false, problems: [{ level: 'fejl', text: 'Resultatet kan ikke beregnes med de værdier (fx kvadratrod af et negativt tal).' }] };
    const scope = { ...vals, [formula.result.symbol]: r.value };
    for (const w of formula.warnings || []) {
      try { if (evaluate(parse(w.when), scope)) problems.push({ level: 'advarsel', text: w.text }); } catch (e) { /* ugyldig regel springes over */ }
    }
    return { ok: true, value: r.value, steps: r.steps, problems };
  } catch (e) {

// Kontrol af en formel: syntaks, variabler, enheder, testeksempel og advarselsregler
function check(formula) {
  const issues = [];
  let ast;
  try { ast = parse(formula.expression); } catch (e) { return [{ level: 'fejl', text: `Formlen kan ikke læses: ${e.message}` }]; }
  const used = variables(ast);
  const declared = new Set((formula.variables || []).map((v) => v.symbol));
  for (const n of used) if (!declared.has(n)) issues.push({ level: 'fejl', text: `Variablen ${n} bruges i formlen, men er ikke beskrevet` });
  for (const v of formula.variables || []) {
    if (!used.has(v.symbol)) issues.push({ level: 'advarsel', text: `Variablen ${v.symbol} er beskrevet, men bruges ikke i formlen` });
    if (!v.unit) issues.push({ level: 'advarsel', text: `${v.symbol} mangler en enhed` });
    if (v.default == null || v.default === '') issues.push({ level: 'advarsel', text: `${v.symbol} mangler en eksempelværdi` });
  }
  if (!formula.result || !formula.result.symbol) issues.push({ level: 'fejl', text: 'Resultatet mangler et symbol' });
  else if (!formula.result.unit) issues.push({ level: 'advarsel', text: 'Resultatet mangler en enhed' });
  const t = formula.test;
  if (!t || t.expected == null || t.expected === '') issues.push({ level: 'advarsel', text: 'Der er intet kontroleksempel – tilføj et regnet eksempel med kendt facit' });

    const vals = {};

      const got = evaluate(ast, vals), exp = parseNum(t.expected);
      const tol = Math.max(1e-6, Math.abs(exp) * 0.005);
      if (Math.abs(got - exp) > tol) issues.push({ level: 'fejl', text: `Kontroleksemplet passer ikke: formlen giver ${fmtNum(got, 4)}, men facit er ${fmtNum(exp, 4)}` });
    } catch (e) { issues.push({ level: 'fejl', text: `Kontroleksemplet kan ikke regnes: ${e.message}` }); }
  }
  for (const w of formula.warnings || []) {
    try { parse(w.when); } catch (e) { issues.push({ level: 'advarsel', text: `Advarselsreglen “${w.when}” kan ikke læses` }); }
  }
  return issues;
}

(function (root) {
'use strict';

// Længste fælles delsekvens → liste af operationer ('=', '-', '+')
function lcsOps(a, b, eq = (x, y) => x === y) {
  const n = a.length, m = b.length;
  // Skær fælles start og slut fra, så tabellen bliver lille
  let s = 0; while (s < n && s < m && eq(a[s], b[s])) s++;
  let e = 0; while (e < n - s && e < m - s && eq(a[n - 1 - e], b[m - 1 - e])) e++;
  const A = a.slice(s, n - e), B = b.slice(s, m - e);
  const W = B.length + 1;
  const dp = new Uint32Array((A.length + 1) * W);
  for (let i = A.length - 1; i >= 0; i--) {
    for (let j = B.length - 1; j >= 0; j--) {
      dp[i * W + j] = eq(A[i], B[j]) ? dp[(i + 1) * W + j + 1] + 1 : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
    }
  }
  const ops = [];
  for (let k = 0; k < s; k++) ops.push(['=', a[k]]);
  let i = 0, j = 0;
  while (i < A.length && j < B.length) {
    if (eq(A[i], B[j])) { ops.push(['=', A[i]]); i++; j++; }
    else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) { ops.push(['-', A[i]]); i++; }
    else { ops.push(['+', B[j]]); j++; }
  }
  while (i < A.length) ops.push(['-', A[i++]]);
  while (j < B.length) ops.push(['+', B[j++]]);
  for (let k = n - e; k < n; k++) ops.push(['=', a[k]]);
  return ops;
}

function diffWords(oldLine, newLine) {
  const tok = (s) => s.match(/\s+|[^\s]+/g) || [];
  const ops = lcsOps(tok(oldLine), tok(newLine));
  const out = [];
  for (const [t, s] of ops) {
    const last = out[out.length - 1];
    if (last && last.t === t) last.s += s; else out.push({ t, s });
  }
  return out;
}

// Returnerer blokke: {type:'same'|'add'|'del'|'mod', text|words} og antal ændringer (sammenhængende hunks)
function diffText(oldText, newText) {
  const a = String(oldText || '').split('\n'), b = String(newText || '').split('\n');
  const ops = lcsOps(a, b);
  const blocks = [];
  let hunks = 0, added = 0, removed = 0;
  for (let k = 0; k < ops.length;) {
    if (ops[k][0] === '=') { blocks.push({ type: 'same', text: ops[k][1] }); k++; continue; }
    // Saml en sammenhængende ændring: alle slettede og tilføjede linjer, før teksten er ens igen
    const dels = [], adds = [];
    while (k < ops.length && ops[k][0] !== '=') { (ops[k][0] === '-' ? dels : adds).push(ops[k][1]); k++; }
    const D = dels.filter((l) => l.trim()), A = adds.filter((l) => l.trim());
    if (D.length || A.length) hunks++;
    // Par linjerne i rækkefølge, så en rettet linje vises med ord-markering
    const pairs = Math.min(D.length, A.length);
    for (let i = 0; i < pairs; i++) { blocks.push({ type: 'mod', words: diffWords(D[i], A[i]) }); added++; removed++; }
    for (let i = pairs; i < D.length; i++) { blocks.push({ type: 'del', text: D[i] }); removed++; }
    for (let i = pairs; i < A.length; i++) { blocks.push({ type: 'add', text: A[i] }); added++; }
  }
  // changes = antal ændrede linjer (en rettet linje tæller én gang) – det tal eleven ser
  return { blocks, hunks, added, removed, changes: blocks.filter((b) => b.type !== 'same').length };
}

  // ---------- Status for arbejdskopien i forhold til seneste udgave ----------
  function chapterStatus(c, latest) {
    if (!latest) return 'ny';
    const pub = latest.chapters.find((x) => x.id === c.id);
    if (!pub) return 'ny';
    if (pub.title !== c.title || pub.content !== c.content || (pub.parentId || null) !== (c.parentId || null)) return 'ændret';
    // Har en central oplysning, formel eller retskilde, som kapitlet bruger, ændret sig siden udgivelsen?
    const snap = ctx.snapshotFor([c.content]);
    const old = latest.refs || { facts: {}, formulas: {}, sources: {} };
    for (const k of Object.keys(snap.facts)) if (!old.facts[k] || old.facts[k].value !== snap.facts[k].value) return 'opdateret indhold';
    for (const k of Object.keys(snap.formulas)) if (JSON.stringify(old.formulas[k]) !== JSON.stringify(snap.formulas[k])) return 'opdateret indhold';
    for (const k of Object.keys(snap.sources)) if (!old.sources[k] || old.sources[k].text !== snap.sources[k].text) return 'opdateret indhold';
    return 'udgivet';
  }

  // Udgavens tekst med henvisninger skrevet ud – grundlaget for ændringslisten
  const resolvedChapters = (chapters, refs) => chapters.map((c) => ({ ...c, resolved: ctx.resolveText(c.content, refs) }));
  function compare(prev, next) {
    const a = prev ? resolvedChapters(prev.chapters, prev.refs) : [];
    const b = resolvedChapters(next.chapters, next.refs);
    const changes = [];
    for (const c of b) {
      const old = a.find((x) => x.id === c.id);
      if (!old) { changes.push({ chapterId: c.id, title: c.title, kind: 'nyt kapitel', hunks: 1, diff: Diff.diffText('', c.resolved) }); continue; }
      const d = Diff.diffText(old.resolved, c.resolved);
      const titleChanged = old.title !== c.title;
      if (d.changes || titleChanged) changes.push({ chapterId: c.id, title: c.title, oldTitle: titleChanged ? old.title : undefined, kind: 'ændret', hunks: d.changes + (titleChanged ? 1 : 0), diff: d });
    }
    for (const c of a) if (!b.some((x) => x.id === c.id)) changes.push({ chapterId: c.id, title: c.title, kind: 'fjernet', hunks: 1, diff: Diff.diffText(c.resolved, '') });
    return changes;
  }
  // Det, der ville blive udgivet nu (scope 'bog' eller ét kapitel)
  function prospective(b, scope, chapterId) {
    const prev = latestEdition(b.id);
    const work = workingChapters(b.id);
    let chapters;
    const pick = (c) => ({ id: c.id, parentId: c.parentId || null, order: c.order, title: c.title, content: c.content });
    if (scope === 'kapitel') {
      const c = work.find((x) => x.id === chapterId);
      if (!c) throw new HttpError(404, 'Kapitlet findes ikke');
      chapters = (prev ? prev.chapters.slice() : []).filter((x) => x.id !== c.id).concat([pick(c)]);
    } else {
      chapters = [];
      for (const c of work) {
        if (c.ready) chapters.push(pick(c));
        else { const old = prev && prev.chapters.find((x) => x.id === c.id); if (old) chapters.push(old); }
      }
    }
    chapters = ordered(chapters);
    const refs = ctx.snapshotFor(chapters.map((c) => c.content));
    return { prev, chapters, refs };
  }
  const summarize = (changes) => changes.map(({ diff, ...rest }) => ({ ...rest, added: diff.added, removed: diff.removed }));
  const editionMeta = (e) => e && ({ id: e.id, version: e.version, publishedAt: e.publishedAt, publishedBy: nameOf(e.publishedBy), notes: e.notes, scope: e.scope, changeCount: e.changeCount, changes: e.changes });

  // ---------- Opsummering af bøger ----------
  function bookSummary(user, b) {
    const s = subjectOf(b);
    const latest = latestEdition(b.id);
    const out = {
      id: b.id, subjectId: b.subjectId, subjectName: s.name, subjectCode: s.code, color: s.color,
      title: b.title, description: b.description, pdfAllowed: !!b.pdfAllowed, hidden: !!b.hidden,
      edition: editionMeta(latest), published: !!latest, author: nameOf(b.authorId), updatedAt: b.updatedAt,
    };
    if (isStaff(user)) {
      const work = workingChapters(b.id);
      const st = work.map((c) => chapterStatus(c, latest));
      out.chapterCount = work.length;
      out.pending = st.filter((x) => x !== 'udgivet').length;
      out.draftChapters = st.filter((x) => x === 'ny').length;
    } else {
      const chs = latest ? latest.chapters : [];
      out.chapterCount = chs.length;
      out.readCount = chs.filter((c) => db().reads.some((r) => r.userId === user.id && r.chapterId === c.id)).length;
    }
    return out;
  }
  ctx.bookSummary = bookSummary;
  ctx.booksForSubject = (user, subjectId) => db().books
    .filter((b) => b.subjectId === subjectId && (isStaff(user) || (!b.hidden && latestEdition(b.id))))
    .map((b) => bookSummary(user, b));

  route('GET', '/api/books', ({ user }) => {
    requireRole(user);
    const ids = new Set(mySubjects(user).map((s) => s.id));
    const books = db().books.filter((b) => ids.has(b.subjectId) && (isStaff(user) || (!b.hidden && latestEdition(b.id))))
      .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))
      .map((b) => bookSummary(user, b));
    return reply(200, { books });
  });

  route('POST', '/api/subjects/:id/books', ({ user, params, body }) => {
    requireRole(user, 'teacher');
    const s = subjectFor(user, params.id);
    const b = { id: newId('b'), subjectId: s.id, title: str(body.title, 'titel', { max: 200 }), description: str(body.description, 'beskrivelse', { max: 1000, required: false }), pdfAllowed: true, hidden: false, authorId: user.id, createdAt: now(), updatedAt: now(), updatedBy: user.id };
    db().books.push(b);
    ctx.logActivity(user, s.id, `Oprettede bogen “${b.title}”`, `#/rediger-bog/${b.id}`);
    saveDb();
    return reply(201, b);
  });

  // Bog: underviseren får arbejdskopien med status; eleven får den udgivne udgave
  route('GET', '/api/books/:id', ({ user, params, query }) => {
    requireRole(user);
    const b = bookOr404(params.id);
    canRead(user, b);
    const latest = latestEdition(b.id);
    const editions = editionsOf(b.id).slice().reverse().map(editionMeta);
    const base = { ...bookSummary(user, b), editions };
    const wantEdition = query.edition ? db().editions.find((e) => e.id === query.edition && e.bookId === b.id) : null;
    if (isStaff(user) && !wantEdition) {
      const work = workingChapters(b.id);
      const nums = numbering(work);
      return reply(200, { ...base, mode: 'arbejdskopi', chapters: ordered(work).map((c) => ({
        id: c.id, parentId: c.parentId || null, number: nums[c.id], title: c.title, ready: !!c.ready,
        status: chapterStatus(c, latest), words: words(c.content), updatedAt: c.updatedAt, updatedBy: nameOf(c.updatedBy),
      })) });
    }
    const e = wantEdition || latest;
    if (!e) return reply(200, { ...base, mode: 'udgave', chapters: [] });
    const nums = numbering(e.chapters);
    return reply(200, { ...base, mode: 'udgave', viewing: editionMeta(e), chapters: ordered(e.chapters).map((c) => ({
      id: c.id, parentId: c.parentId || null, number: nums[c.id], title: c.title, words: words(c.content),
      read: db().reads.some((r) => r.userId === user.id && r.chapterId === c.id),
      changed: (e.changes || []).some((x) => x.chapterId === c.id),
    })) });
  });

  route('PUT', '/api/books/:id', ({ user, params, body }) => {
    requireRole(user, 'teacher');
    const b = bookOr404(params.id);
    subjectFor(user, b.subjectId);
    if (body.title !== undefined) b.title = str(body.title, 'titel', { max: 200 });
    if (body.description !== undefined) b.description = str(body.description, 'beskrivelse', { max: 1000, required: false });
    if (body.pdfAllowed !== undefined) b.pdfAllowed = !!body.pdfAllowed;
    if (body.hidden !== undefined) b.hidden = !!body.hidden;
    b.updatedAt = now(); b.updatedBy = user.id;
    saveDb();
    return reply(200, b);
  });
  route('DELETE', '/api/books/:id', ({ user, params }) => {
    requireRole(user, 'teacher');
    const b = bookOr404(params.id);
    subjectFor(user, b.subjectId);
    const ids = new Set(db().chapters.filter((c) => c.bookId === b.id).map((c) => c.id));
    db().books = db().books.filter((x) => x.id !== b.id);
    db().chapters = db().chapters.filter((c) => c.bookId !== b.id);
    db().editions = db().editions.filter((e) => e.bookId !== b.id);
    db().reads = db().reads.filter((r) => !ids.has(r.chapterId));
    db().bookmarks = db().bookmarks.filter((x) => x.bookId !== b.id);
    ctx.logActivity(user, b.subjectId, `Slettede bogen “${b.title}”`);
    saveDb();
    return reply(200, { ok: true });
  });

  // ---------- Kapitler (arbejdskopi) ----------
  function newChapter(user, b, { title, content = '', parentId = null }) {
    const siblings = db().chapters.filter((c) => c.bookId === b.id);
    if (parentId && !siblings.some((c) => c.id === parentId && !c.parentId)) throw new HttpError(400, 'Underkapitler kan kun ligge under et hovedkapitel');
    const c = {
      id: newId('c'), bookId: b.id, parentId: parentId || null, order: siblings.reduce((m, x) => Math.max(m, x.order), 0) + 1,
      title, content, ready: false, createdAt: now(), updatedAt: now(), updatedBy: user.id, revisions: [],
    };
    db().chapters.push(c);
    return c;
  }
  route('POST', '/api/books/:id/chapters', ({ user, params, body }) => {
    requireRole(user, 'teacher');
    const b = bookOr404(params.id);
    subjectFor(user, b.subjectId);
    const c = newChapter(user, b, { title: str(body.title, 'titel', { max: 200 }), content: str(body.content, 'indhold', { required: false, max: 200000 }), parentId: body.parentId || null });
    b.updatedAt = now();
    ctx.logActivity(user, b.subjectId, `Tilføjede kapitlet “${c.title}” i “${b.title}”`, `#/rediger-kapitel/${c.id}`);
    saveDb();
    return reply(201, c);
  });
  // Import: mange kapitler på én gang (tekst er allerede trukket ud af PDF/Word i browseren)
  route('POST', '/api/books/:id/import', ({ user, params, body }) => {
    requireRole(user, 'teacher');
    const b = bookOr404(params.id);
    subjectFor(user, b.subjectId);
    const list = Array.isArray(body.chapters) ? body.chapters.slice(0, 200) : [];
    if (!list.length) throw new HttpError(400, 'Der er ingen kapitler at importere');
    let lastTop = null; const created = [];
    for (const x of list) {
      const c = newChapter(user, b, { title: str(x.title, 'titel', { max: 200 }), content: str(x.content, 'indhold', { required: false, max: 200000 }), parentId: x.level === 2 && lastTop ? lastTop.id : null });
      if (!c.parentId) lastTop = c;
      created.push(c.id);
    }
    ctx.logActivity(user, b.subjectId, `Importerede ${created.length} kapitler fra “${str(body.fileName, 'fil', { max: 200, required: false }) || 'dokument'}” til “${b.title}”`, `#/rediger-bog/${b.id}`);
    saveDb();
    return reply(201, { created: created.length });
  });

  route('GET', '/api/chapters/:id', ({ user, params }) => {
    requireRole(user, 'teacher');
    const c = chapterOr404(params.id);
    const b = bookOr404(c.bookId);
    subjectFor(user, b.subjectId);
    const latest = latestEdition(b.id);
    const pub = latest && latest.chapters.find((x) => x.id === c.id);
    return reply(200, {
      id: c.id, bookId: b.id, bookTitle: b.title, subjectId: b.subjectId, color: subjectOf(b).color, parentId: c.parentId,
      title: c.title, content: c.content, ready: !!c.ready, status: chapterStatus(c, latest), updatedAt: c.updatedAt, updatedBy: nameOf(c.updatedBy),
      publishedVersion: pub ? latest.version : null, refs: ctx.snapshotFor([c.content]),
      parents: workingChapters(b.id).filter((x) => !x.parentId && x.id !== c.id).map((x) => ({ id: x.id, title: x.title })),
      revisions: c.revisions.map((r, i) => ({ index: i, title: r.title, savedAt: r.savedAt, savedBy: nameOf(r.savedBy), words: words(r.content), why: r.why || '' })),
    });
  });
  function saveRevision(c, user, why) {
    c.revisions.unshift({ title: c.title, content: c.content, savedAt: c.updatedAt, savedBy: c.updatedBy, why: c.lastWhy || '' });
    c.revisions = c.revisions.slice(0, MAX_REVISIONS);
    c.updatedAt = now(); c.updatedBy = user.id; c.lastWhy = why || '';
  }
  ctx.saveRevision = saveRevision;
  route('PUT', '/api/chapters/:id', ({ user, params, body }) => {
    requireRole(user, 'teacher');
    const c = chapterOr404(params.id);
    const b = bookOr404(c.bookId);
    subjectFor(user, b.subjectId);
    const title = body.title !== undefined ? str(body.title, 'titel', { max: 200 }) : c.title;
    const content = body.content !== undefined ? str(body.content, 'indhold', { required: false, max: 200000 }) : c.content;
    if (title !== c.title || content !== c.content) {
      saveRevision(c, user, str(body.why, 'begrundelse', { max: 300, required: false }));
      c.title = title; c.content = content;
      ctx.logActivity(user, b.subjectId, `Redigerede “${c.title}” i “${b.title}”`, `#/rediger-kapitel/${c.id}`);
    }
    if (body.ready !== undefined) c.ready = !!body.ready;
    if (body.parentId !== undefined) {
      const pid = body.parentId || null;
      if (pid && (pid === c.id || db().chapters.some((x) => x.parentId === c.id))) throw new HttpError(400, 'Et kapitel med underkapitler kan ikke selv blive underkapitel');
      if (pid && !db().chapters.some((x) => x.id === pid && x.bookId === b.id && !x.parentId)) throw new HttpError(400, 'Ugyldigt hovedkapitel');
      c.parentId = pid;
    }
    b.updatedAt = now();
    saveDb();
    return reply(200, { id: c.id, title: c.title, ready: c.ready, updatedAt: c.updatedAt, status: chapterStatus(c, latestEdition(b.id)), revisionCount: c.revisions.length });
  });
  route('GET', '/api/chapters/:id/revisions/:index', ({ user, params }) => {
    requireRole(user, 'teacher');
    const c = chapterOr404(params.id);
    subjectFor(user, bookOr404(c.bookId).subjectId);
    const r = c.revisions[Number(params.index)];
    if (!r) throw new HttpError(404, 'Versionen findes ikke');
    return reply(200, { ...r, savedBy: nameOf(r.savedBy), diff: Diff.diffText(r.content, c.content) });
  });
  route('POST', '/api/chapters/:id/restore/:index', ({ user, params }) => {
    requireRole(user, 'teacher');
    const c = chapterOr404(params.id);
    const b = bookOr404(c.bookId);
    subjectFor(user, b.subjectId);
    const r = c.revisions[Number(params.index)];
    if (!r) throw new HttpError(404, 'Versionen findes ikke');
    saveRevision(c, user, 'Før gendannelse');
    c.title = r.title; c.content = r.content;
    ctx.logActivity(user, b.subjectId, `Gendannede en tidligere version af “${c.title}”`, `#/rediger-kapitel/${c.id}`);
    saveDb();
    return reply(200, { ok: true });
  });
  route('POST', '/api/chapters/:id/move', ({ user, params, body }) => {
    requireRole(user, 'teacher');
    const c = chapterOr404(params.id);
    const b = bookOr404(c.bookId);
    subjectFor(user, b.subjectId);
    const sibs = db().chapters.filter((x) => x.bookId === b.id && (x.parentId || null) === (c.parentId || null)).sort((x, y) => x.order - y.order);
    const i = sibs.indexOf(c), j = i + (Number(body.dir) < 0 ? -1 : 1);
    if (j >= 0 && j < sibs.length) { const o = sibs[j].order; sibs[j].order = c.order; c.order = o; saveDb(); }
    return reply(200, { ok: true });
  });
  route('DELETE', '/api/chapters/:id', ({ user, params }) => {
    requireRole(user, 'teacher');
    const c = chapterOr404(params.id);
    const b = bookOr404(c.bookId);
    subjectFor(user, b.subjectId);
    db().chapters = db().chapters.filter((x) => x.id !== c.id).map((x) => (x.parentId === c.id ? { ...x, parentId: null } : x));
    ctx.logActivity(user, b.subjectId, `Slettede kapitlet “${c.title}” fra arbejdskopien af “${b.title}”`, `#/rediger-bog/${b.id}`);
    saveDb();
    return reply(200, { ok: true });
  });

  // ---------- Udgivelse ----------
  route('GET', '/api/books/:id/pending', ({ user, params, query }) => {
    requireRole(user, 'teacher');
    const b = bookOr404(params.id);
    subjectFor(user, b.subjectId);
    const p = prospective(b, query.scope === 'kapitel' ? 'kapitel' : 'bog', query.chapterId);
    const changes = compare(p.prev, p);
    const prevV = p.prev ? p.prev.version : null;
    return reply(200, {
      book: { id: b.id, title: b.title }, current: prevV, next: { minor: nextVersion(p.prev, 'minor'), major: nextVersion(p.prev, 'major') },
      changeCount: changes.reduce((n, c) => n + c.hunks, 0), changes,
      // Kapitler med egne tekstændringer, der ikke er markeret klar. (Ændrede centrale oplysninger og formler kommer automatisk med.)
      notReady: workingChapters(b.id).filter((c) => !c.ready && ['ny', 'ændret'].includes(chapterStatus(c, p.prev))).map((c) => ({ id: c.id, title: c.title, status: chapterStatus(c, p.prev) })),
      suggestedNotes: changes.map((c) => `${c.kind === 'nyt kapitel' ? 'Nyt kapitel' : c.kind === 'fjernet' ? 'Fjernet' : 'Opdateret'}: ${c.title}`).join('\n'),
    });
  });
  function nextVersion(prev, kind) {
    if (!prev) return '1.0';
    return kind === 'major' ? `${prev.major + 1}.0` : `${prev.major}.${prev.minor + 1}`;
  }
  route('POST', '/api/books/:id/publish', ({ user, params, body }) => {
    requireRole(user, 'teacher');
    const b = bookOr404(params.id);
    subjectFor(user, b.subjectId);
    const e = publishBook(user, b, body);
    return reply(201, { ...editionMeta(e), notified: subjectOf(b).studentIds.length });
  });
  // Udgiv: gem øjebliksbillede, registrér ændringer, opdatér elevportalen, giv besked, bevar historik
  function publishBook(user, b, body) {
    const s = subjectOf(b);
    const scope = body.scope === 'kapitel' ? 'kapitel' : 'bog';
    const p = prospective(b, scope, body.chapterId);
    const changes = compare(p.prev, p);
    const changeCount = changes.reduce((n, c) => n + c.hunks, 0);
    if (!changeCount) throw new HttpError(409, 'Der er ingen ændringer at udgive');
    const kind = body.kind === 'major' ? 'major' : 'minor';
    const version = body.version || nextVersion(p.prev, kind);
    const [major, minor] = version.split('.').map(Number);
    const e = {
      id: newId('e'), bookId: b.id, version, major, minor, scope, publishedAt: body.at || now(), publishedBy: user.id,
      notes: str(body.notes, 'udgivelsesnoter', { max: 3000, required: false }),
      chapters: p.chapters, refs: p.refs, changeCount, changes: summarize(changes),
    };
    db().editions.push(e);
    // Udgivne kapitler er ikke længere "klar" – næste udgivelse starter forfra
    for (const c of workingChapters(b.id)) if (scope === 'bog' || c.id === body.chapterId) c.ready = false;
    b.updatedAt = now();
    const what = scope === 'kapitel' ? `kapitlet “${(p.chapters.find((c) => c.id === body.chapterId) || {}).title}”` : 'hele bogen';
    if (!body.silent) ctx.logActivity(user, b.subjectId, `Udgav “${b.title}” version ${version} (${what}) med ${changeCount} ændring${changeCount === 1 ? '' : 'er'}`, `#/aendringer/${e.id}`);
    for (const sid of s.studentIds) {
      db().notifications.push({ id: newId('nt'), userId: sid, at: body.at || now(), read: !!body.silent, kind: 'udgave',
        text: `${b.title} – version ${version} er udgivet. Der er ${changeCount} ændring${changeCount === 1 ? '' : 'er'} siden sidste version.`, link: `#/aendringer/${e.id}` });
    }
    saveDb();
    return e;
  }
  ctx.publishBook = publishBook;
  // Hvad er ændret i en udgave (i forhold til den forrige)?
  route('GET', '/api/editions/:id/changes', ({ user, params }) => {
    requireRole(user);
    const e = db().editions.find((x) => x.id === params.id);
    if (!e) throw new HttpError(404, 'Udgaven findes ikke');
    const b = bookOr404(e.bookId);
    canRead(user, b);
    const list = editionsOf(b.id);
    const prev = list[list.indexOf(e) - 1] || null;
    return reply(200, { book: { id: b.id, title: b.title, color: subjectOf(b).color }, edition: editionMeta(e), previous: prev ? prev.version : null, changes: compare(prev, e) });
  });

  // ---------- Elev: læs et kapitel i en udgave ----------
  route('GET', '/api/books/:id/chapters/:cid', ({ user, params, query }) => {
    requireRole(user);
    const b = bookOr404(params.id);
    canRead(user, b);
    const e = (query.edition && db().editions.find((x) => x.id === query.edition && x.bookId === b.id)) || latestEdition(b.id);
    if (!e) throw new HttpError(404, 'Bogen er ikke udgivet endnu');
    const list = ordered(e.chapters);
    const i = list.findIndex((c) => c.id === params.cid);
    if (i < 0) throw new HttpError(404, 'Kapitlet findes ikke i denne udgave');
    const c = list[i];
    const nums = numbering(e.chapters);
    const used = ctx.refsIn(c.content);
    const pickRefs = (obj, keys) => Object.fromEntries([...keys].filter((k) => obj[k]).map((k) => [k, obj[k]]));
    const note = db().notes.find((n) => n.userId === user.id && n.chapterId === c.id);
    return reply(200, {
      id: c.id, bookId: b.id, bookTitle: b.title, color: subjectOf(b).color, title: c.title, content: c.content, number: nums[c.id],
      edition: editionMeta(e), pdfAllowed: !!b.pdfAllowed,
      refs: { facts: pickRefs(e.refs.facts, used.fakta), formulas: pickRefs(e.refs.formulas, used.formel), sources: pickRefs(e.refs.sources, used.kilde) },
      prev: list[i - 1] ? { id: list[i - 1].id, title: list[i - 1].title } : null,
      next: list[i + 1] ? { id: list[i + 1].id, title: list[i + 1].title } : null,
      read: db().reads.some((r) => r.userId === user.id && r.chapterId === c.id),
      changedInThisEdition: (e.changes || []).some((x) => x.chapterId === c.id),
      note: note ? note.text : '',
      bookmarks: db().bookmarks.filter((x) => x.userId === user.id && x.chapterId === c.id),
    });
  });
  route('POST', '/api/chapters/:id/read', ({ user, params, body }) => {
    requireRole(user, 'student');
    const e = db().editions.find((x) => x.chapters.some((c) => c.id === params.id));
    if (!e) throw new HttpError(404, 'Kapitlet findes ikke');

      lines.push(`Bog: ${b.title}`);

      const provisions = db().sources.flatMap((s) => s.provisions.filter((p) => `${s.short} ${p.ref} ${p.title} ${p.text}`.toLowerCase().includes(q.toLowerCase())).map((p) => ({ ...p, source: s.short, usage: ctx.usage('kilde', p.key) })));
      return reply(200, { kind: 'find', query: q, hits, facts: facts.map((f) => ({ ...f, usage: ctx.usage('fakta', f.key) })), provisions });
    }
    if (cmd === 'tjek-formler') {
      const report = db().formulas.map((f) => ({ id: f.id, name: f.name, key: f.key, issues: Formula.check(f), usage: ctx.usage('formel', f.key).length }));
      // Henvisninger til formler, oplysninger og kilder, der ikke findes
      const broken = [];

        return { id: b.id, title: b.title, version: p.prev ? p.prev.version : null, readyChanges: changes.map(({ diff, ...r }) => r), pending: allPending };

// Rohub – portalens API-logik.
// Miljøneutral: bruges af server.js (Node) og af browser-demoen (build-demo.js).
(function (root) {
'use strict';

function createApi(env) {
  // env: { hashPassword, verifyPassword, randomHex, load() -> db|null, save(db), seed(hashPassword) -> db }
  let db;
  const sessions = new Map(); // token -> { userId, expires }
  const newId = (prefix) => `${prefix}${env.randomHex(6)}`;
  const saveDb = () => env.save(db);
  function loadDb(reset = false) {
    db = reset ? null : env.load();
    if (db) { db.monitor = db.monitor || null; for (const k of ['lessons', 'messages', 'books', 'chapters', 'reads', 'activity', 'editions', 'facts', 'sources', 'formulas', 'legalChanges', 'proposals', 'changeLog', 'notifications', 'bookmarks', 'notes', 'groups', 'products']) db[k] = db[k] || []; }
    else { db = env.seed(env.hashPassword); saveDb(); }
    runSeedScript();
  }
  const hashPassword = env.hashPassword, verifyPassword = env.verifyPassword;
  const reply = (status, data, extra = {}) => ({ status, data, ...extra });
  function userFromSid(sid) {
    const s = sid && sessions.get(sid);
    if (!s || s.expires < Date.now()) { if (s) sessions.delete(sid); return null; }
    s.expires = Date.now() + SESSION_TTL_MS;
    return db.users.find((u) => u.id === s.userId) || null;
  }

const SESSION_TTL_MS = 8 * 60 * 60 * 1000; // 8 timer
const GRADES = ['12', '10', '7', '4', '02', '00', '-3']; // 7-trinsskalaen

const publicUser = (u) => u && ({ id: u.id, username: u.username, name: u.name, role: u.role, className: u.className || null });

// ---------- Hjælpere ----------
class HttpError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
function str(v, field, { max = 5000, required = true } = {}) {
  const s = typeof v === 'string' ? v.trim() : '';
  if (required && !s) throw new HttpError(400, `Feltet "${field}" skal udfyldes`);
  if (s.length > max) throw new HttpError(400, `Feltet "${field}" er for langt`);
  return s;
}
function safeLink(v) {
  const s = str(v, 'link', { max: 500, required: false });
  if (s && !/^https?:\/\//i.test(s)) throw new HttpError(400, 'Link skal starte med http:// eller https://');
  return s;
}
// Administrator har altid samme rettigheder som en underviser.
const isStaff = (u) => !!u && (u.role === 'teacher' || u.role === 'admin');
function requireRole(user, role) {
  if (!user) throw new HttpError(401, 'Du skal være logget ind');
  if (role === 'teacher' ? !isStaff(user) : role && user.role !== role) throw new HttpError(403, 'Du har ikke adgang til dette');
}
function subjectFor(user, subjectId) {
  const s = db.subjects.find((x) => x.id === subjectId);
  if (!s) throw new HttpError(404, 'Faget findes ikke');
  const member = user.role === 'admin' || (isStaff(user) ? s.teacherIds.includes(user.id) : s.studentIds.includes(user.id));
  if (!member) throw new HttpError(403, 'Du er ikke tilknyttet dette fag');
  return s;
}
function mySubjects(user) {
  if (user.role === 'admin') return db.subjects.slice();
  return db.subjects.filter((s) => (isStaff(user) ? s.teacherIds : s.studentIds).includes(user.id));
}
const nameOf = (id) => (db.users.find((u) => u.id === id) || {}).name || 'Ukendt';
const byDateDesc = (k) => (a, b) => (b[k] || '').localeCompare(a[k] || '');

function subjectSummary(s, user) {
  const assignments = db.assignments.filter((a) => a.subjectId === s.id);
  const base = {
    id: s.id, code: s.code, name: s.name, color: s.color, description: s.description,
    teachers: s.teacherIds.map(nameOf),
    materialCount: db.materials.filter((m) => m.subjectId === s.id).length,
    assignmentCount: assignments.length,
  };
  if (isStaff(user)) {
    base.studentCount = s.studentIds.length;
    base.ungraded = db.submissions.filter((x) => x.grade == null && assignments.some((a) => a.id === x.assignmentId)).length;
  } else {
    const mine = db.submissions.filter((x) => x.studentId === user.id && assignments.some((a) => a.id === x.assignmentId));
    base.openAssignments = assignments.filter((a) => !mine.some((m) => m.assignmentId === a.id)).length;
  }
  return base;
}

function assignmentView(a, user, subject) {
  const out = { ...a, author: nameOf(a.authorId) };
  if (user.role === 'student') {
    const sub = db.submissions.find((x) => x.assignmentId === a.id && x.studentId === user.id);
    out.mySubmission = sub || null;
  } else {
    const subs = db.submissions.filter((x) => x.assignmentId === a.id);
    out.submissionCount = subs.length;
    out.ungraded = subs.filter((x) => x.grade == null).length;
    out.studentCount = subject.studentIds.length;
  }
  return out;
}

// ---------- API-ruter ----------
const routes = [];
const route = (method, pattern, handler) => {
  const keys = [];
  const re = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '$');
  routes.push({ method, re, keys, handler });
};

route('POST', '/api/login', ({ body }) => {
  const username = str(body.username, 'brugernavn', { max: 100 }).toLowerCase();
  const password = str(body.password, 'adgangskode', { max: 200 });
  const user = db.users.find((u) => u.username === username);
  if (!user || !verifyPassword(password, user.password)) throw new HttpError(401, 'Forkert brugernavn eller adgangskode');
  const token = env.randomHex(32);
  sessions.set(token, { userId: user.id, expires: Date.now() + SESSION_TTL_MS });
  return reply(200, { user: publicUser(user) }, { sid: token });
});

route('POST', '/api/logout', ({ sid }) => {
  if (sid) sessions.delete(sid);
  return reply(200, { ok: true }, { clearSid: true });
});

route('GET', '/api/me', ({ user }) => {
  requireRole(user);
  return reply(200, { user: publicUser(user), grades: GRADES });
});

route('GET', '/api/dashboard', ({ user }) => {
  requireRole(user);
  const subs = mySubjects(user);
  const subjectIds = new Set(subs.map((s) => s.id));
  const subjectName = (id) => (db.subjects.find((s) => s.id === id) || {}).name;
  const announcements = db.announcements.filter((n) => subjectIds.has(n.subjectId)).sort(byDateDesc('createdAt')).slice(0, 5)
    .map((n) => ({ ...n, subjectName: subjectName(n.subjectId), author: nameOf(n.authorId) }));
  const assignments = db.assignments.filter((a) => subjectIds.has(a.subjectId));
  const today = ((new Date().getDay() + 6) % 7) + 1; // 1 = mandag … 7 = søndag
  const out = {
    subjects: subs.map((s) => subjectSummary(s, user)), announcements,
    today, todayLessons: lessonsFor(user).filter((l) => l.weekday === today),
    unreadMessages: db.messages.filter((m) => m.toId === user.id && !m.read).length,
  };

  if (user.role === 'student') {
    const mine = db.submissions.filter((x) => x.studentId === user.id);
    out.upcoming = assignments.filter((a) => !mine.some((m) => m.assignmentId === a.id))
      .sort((a, b) => a.due.localeCompare(b.due))
      .map((a) => ({ ...a, subjectName: subjectName(a.subjectId) }));
    out.grades = mine.filter((x) => x.grade != null).sort(byDateDesc('gradedAt')).map((x) => {
      const a = db.assignments.find((y) => y.id === x.assignmentId) || {};
      return { ...x, assignmentTitle: a.title, subjectId: a.subjectId, subjectName: subjectName(a.subjectId) };
    });
  } else {
    out.toGrade = db.submissions.filter((x) => x.grade == null && assignments.some((a) => a.id === x.assignmentId))
      .sort((a, b) => a.submittedAt.localeCompare(b.submittedAt))
      .map((x) => {
        const a = assignments.find((y) => y.id === x.assignmentId);
        return { ...x, studentName: nameOf(x.studentId), assignmentTitle: a.title, subjectId: a.subjectId, subjectName: subjectName(a.subjectId) };
      });
  }
  return reply(200, out);
});

route('GET', '/api/subjects/:id', ({ user, params }) => {
  requireRole(user);

  const out = {

    announcements: db.announcements.filter((n) => n.subjectId === s.id).sort(byDateDesc('createdAt')).map((n) => ({ ...n, author: nameOf(n.authorId) })),
    books: ctx.booksForSubject(user, s.id),
  };
  if (isStaff(user)) {
    out.students = s.studentIds.map((id) => publicUser(db.users.find((u) => u.id === id))).filter(Boolean);
  }
  return reply(200, out);
});

for (const [coll, label] of [['materials', 'Materialet'], ['assignments', 'Opgaven'], ['announcements', 'Opslaget']]) {
  route('DELETE', `/api/${coll}/:id`, ({ user, params }) => {
    requireRole(user, 'teacher');
    const item = db[coll].find((x) => x.id === params.id);
    if (!item) throw new HttpError(404, `${label} findes ikke`);
    subjectFor(user, item.subjectId);
    db[coll] = db[coll].filter((x) => x.id !== item.id);
    if (coll === 'assignments') db.submissions = db.submissions.filter((x) => x.assignmentId !== item.id);
    saveDb();
    return reply(200, { ok: true });
  });
}

  else {
    sub = { id: newId('sub'), assignmentId: a.id, studentId: user.id, text, submittedAt: new Date().toISOString(), grade: null, feedback: '', gradedAt: null };
    db.submissions.push(sub);
  }
  saveDb();
  return reply(201, sub);
});

route('GET', '/api/subjects/:id/gradebook', ({ user, params }) => {
  requireRole(user, 'teacher');
  const s = subjectFor(user, params.id);
  const assignments = db.assignments.filter((a) => a.subjectId === s.id).sort((a, b) => a.due.localeCompare(b.due));
  const rows = s.studentIds.map((sid) => ({
    student: publicUser(db.users.find((u) => u.id === sid)),
    cells: assignments.map((a) => {

    }),

});

// ---------- Skema ----------
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function lessonsFor(user) {
  const subs = mySubjects(user);
  return db.lessons.filter((l) => subs.some((s) => s.id === l.subjectId))
    .map((l) => {
      const s = subs.find((x) => x.id === l.subjectId);
      return { ...l, subjectName: s.name, subjectCode: s.code, color: s.color, teacher: nameOf(l.teacherId) };
    })
    .sort((a, b) => a.weekday - b.weekday || a.start.localeCompare(b.start));
}
route('GET', '/api/schedule', ({ user }) => {
  requireRole(user);
  return reply(200, { lessons: lessonsFor(user) });
});
route('POST', '/api/subjects/:id/lessons', ({ user, params, body }) => {
  requireRole(user, 'teacher');
  const s = subjectFor(user, params.id);
  const weekday = Number(body.weekday);
  if (!(weekday >= 1 && weekday <= 5)) throw new HttpError(400, 'Vælg en ugedag (mandag–fredag)');
  const start = str(body.start, 'starttid', { max: 5 }), end = str(body.end, 'sluttid', { max: 5 });
  if (!TIME_RE.test(start) || !TIME_RE.test(end) || end <= start) throw new HttpError(400, 'Ugyldigt tidsrum');
  const l = { id: newId('l'), subjectId: s.id, weekday, start, end, room: str(body.room, 'lokale', { max: 80, required: false }), teacherId: user.id };
  db.lessons.push(l); saveDb();
  return reply(201, l);
});
route('DELETE', '/api/lessons/:id', ({ user, params }) => {
  requireRole(user, 'teacher');
  const l = db.lessons.find((x) => x.id === params.id);
  if (!l) throw new HttpError(404, 'Lektionen findes ikke');
  subjectFor(user, l.subjectId);
  db.lessons = db.lessons.filter((x) => x.id !== l.id); saveDb();
  return reply(200, { ok: true });
});

// ---------- Beskeder (elev ↔ lærer i fælles fag) ----------
function contactsOf(user) {
  const ids = new Set();
  for (const s of mySubjects(user)) (isStaff(user) ? s.studentIds : s.teacherIds).forEach((id) => ids.add(id));
  ids.delete(user.id);
  return [...ids].map((id) => db.users.find((u) => u.id === id)).filter(Boolean);
}
route('GET', '/api/messages', ({ user }) => {
  requireRole(user);
  const threads = contactsOf(user).map((c) => {
    const msgs = db.messages.filter((m) => (m.fromId === user.id && m.toId === c.id) || (m.fromId === c.id && m.toId === user.id))
      .sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    return {
      contact: publicUser(c),
      subjects: mySubjects(user).filter((s) => [...s.teacherIds, ...s.studentIds].includes(c.id)).map((s) => s.name),
      unread: msgs.filter((m) => m.toId === user.id && !m.read).length,
      last: msgs[msgs.length - 1] || null,
      messages: msgs.map((m) => ({ ...m, mine: m.fromId === user.id })),
    };
  }).sort((a, b) => (b.last ? b.last.createdAt : '').localeCompare(a.last ? a.last.createdAt : '') || a.contact.name.localeCompare(b.contact.name));
  return reply(200, { threads });
});
route('POST', '/api/messages', ({ user, body }) => {
  requireRole(user);
  const to = contactsOf(user).find((c) => c.id === body.toId);
  if (!to) throw new HttpError(403, 'Du kan kun skrive til dine lærere/elever');
  const m = { id: newId('msg'), fromId: user.id, toId: to.id, body: str(body.body, 'besked', { max: 5000 }), createdAt: new Date().toISOString(), read: false };
  db.messages.push(m); saveDb();
  return reply(201, m);
});
route('POST', '/api/messages/read/:contactId', ({ user, params }) => {
  requireRole(user);
  let n = 0;
  for (const m of db.messages) if (m.toId === user.id && m.fromId === params.contactId && !m.read) { m.read = true; n++; }
  if (n) saveDb();
  return reply(200, { ok: true, marked: n });
});

    if (isNaN(due)) throw new HttpError(400, 'Ugyldig afleveringsfrist');
    a.title = str(body.title, 'titel', { max: 200 });
    a.description = str(body.description, 'beskrivelse');
    a.due = due.toISOString();
    a.updatedAt = new Date().toISOString();
    logActivity(user, a.subjectId, `Redigerede opgaven “${a.title}”`, `#/fag/${a.subjectId}/opgaver`);
    saveDb();
    return reply(200, a);
  });
  route('PUT', '/api/announcements/:id', ({ user, params, body }) => {
    requireRole(user, 'teacher');
    const n = db.announcements.find((x) => x.id === params.id);
    if (!n) throw new HttpError(404, 'Opslaget findes ikke');
    subjectFor(user, n.subjectId);
    n.title = str(body.title, 'titel', { max: 200 });
    n.body = str(body.body, 'tekst');
    n.updatedAt = new Date().toISOString();
    logActivity(user, n.subjectId, `Redigerede opslaget “${n.title}”`, `#/fag/${n.subjectId}`);
    saveDb();
    return reply(200, n);
  });
  route('PUT', '/api/lessons/:id', ({ user, params, body }) => {
    requireRole(user, 'teacher');
    const l = db.lessons.find((x) => x.id === params.id);
    if (!l) throw new HttpError(404, 'Lektionen findes ikke');
    subjectFor(user, l.subjectId);
    const weekday = Number(body.weekday);
    if (!(weekday >= 1 && weekday <= 5)) throw new HttpError(400, 'Vælg en ugedag (mandag–fredag)');
    const start = str(body.start, 'starttid', { max: 5 }), end = str(body.end, 'sluttid', { max: 5 });
    if (!TIME_RE.test(start) || !TIME_RE.test(end) || end <= start) throw new HttpError(400, 'Ugyldigt tidsrum');
    Object.assign(l, { weekday, start, end, room: str(body.room, 'lokale', { max: 80, required: false }) });
    saveDb();
    return reply(200, l);
  });

  const ctx = {

// ---------- Diff-visning ----------
function renderDiff(diff, opts = {}) {
  const ctxLines = opts.context == null ? 1 : opts.context;
  const out = h('div.diff');
  const blocks = diff.blocks;
  blocks.forEach((b, i) => {
    if (b.type === 'same') {
      const near = blocks.slice(Math.max(0, i - ctxLines), i + ctxLines + 1).some((x) => x.type !== 'same');
      if (!near) { if (out.lastChild && !out.lastChild.classList.contains('diff-gap')) out.append(h('div.diff-gap', '⋯')); return; }
      if (b.text.trim() && !/^\s*\|?[\s:|-]+\|?\s*$/.test(b.text)) out.append(h('div.diff-line.same', b.text));
      return;
    }
    if (b.type === 'add') return out.append(h('div.diff-line.add', h('span.diff-mark', '+'), h('ins', b.text)));
    if (b.type === 'del') return out.append(h('div.diff-line.del', h('span.diff-mark', '−'), h('del', b.text)));
    out.append(h('div.diff-line.mod', h('span.diff-mark', '~'), b.words.map((w) => (w.t === '+' ? h('ins', w.s) : w.t === '-' ? h('del', w.s) : w.s))));
  });
  if (!blocks.some((b) => b.type !== 'same')) out.append(h('p.small.muted', 'Ingen tekstændringer.'));
  return out;
}

async function viewBook(bookId, chapterId) {
  loading();

  const b = await api('GET', `/api/books/${bookId}${q.udgave ? '?edition=' + encodeURIComponent(q.udgave) : ''}`);
  // Underviseren får arbejdskopien fra /api/books/:id – til læsning bruges den udgivne version
  let book = b;
  if (isTeacher() && b.mode === 'arbejdskopi') {
    if (!b.edition) { render(h('div.card', h('h1', b.title), h('p', 'Bogen er ikke udgivet endnu, så eleverne kan ikke se den.'), h('a.btn', { href: `#/rediger-bog/${b.id}` }, 'Gå til redigering'))); return; }

    isTeacher() ? h('a.btn.small', { href: `#/rediger-bog/${book.id}` }, icon('pencil', 16), 'Redigér bogen') : null);

        h('ul.list', book.editions.map((e) => h('li.row', h('div', h('strong', `Version ${e.version}`), h('div.small.muted', `${fmtDate(e.publishedAt)} · ${e.changeCount} ændring${e.changeCount === 1 ? '' : 'er'}`)),
          h('div.actions', h('a.btn.ghost.small', { href: `#/aendringer/${e.id}` }, 'Ændringer'), h('a.btn.ghost.small', { href: `#/bog/${book.id}?udgave=${e.id}` }, 'Læs denne version')))))) : null);

const MD_TOOLS = [
  ['H2', 'Overskrift', '\n## ', ''], ['H3', 'Underoverskrift', '\n### ', ''], ['B', 'Fed', '**', '**'], ['I', 'Kursiv', '*', '*'],
  ['•', 'Punktliste', '\n- ', ''], ['1.', 'Nummereret liste', '\n1. ', ''], ['❝', 'Citat / huskeregel', '\n> ', ''],
  ['Tabel', 'Tabel', '\n| Kolonne 1 | Kolonne 2 |\n|---|---|\n| ', ' |  |\n'], ['Link', 'Link', '[', '](https://)'], ['Billede', 'Billede (adresse)', '![Beskrivelse](', 'https://)'],
];
async function viewChapterEditor(chapterId) {
  loading();
  const [c, refsList] = await Promise.all([api('GET', `/api/chapters/${chapterId}`), api('GET', '/api/references')]);
  let saved = { title: c.title, content: c.content };
  let refs = c.refs, ready = c.ready;
  const titleIn = h('input.title-input', { value: c.title, 'aria-label': 'Kapitlets titel', required: true });
  const ta = h('textarea.md-input', { value: c.content, spellcheck: true, 'aria-label': 'Kapitlets tekst' });
  const preview = h('div.md-preview');
  const status = h('span.save-status.small');
  const counter = h('span.small.muted');
  const dirty = () => titleIn.value !== saved.title || ta.value !== saved.content;
  const tokenKey = (t) => (t.match(/\{\{(fakta|formel|kilde):[A-Za-z0-9_-]+\}\}/g) || []).sort().join('|');
  let lastTokens = tokenKey(c.content);

  async function refresh() {
    const tk = tokenKey(ta.value);
    if (tk !== lastTokens) { lastTokens = tk; try { refs = await api('POST', '/api/references/resolve', { content: ta.value }); } catch (e) { /* behold gamle */ } }
    setKids(preview, h('h1', titleIn.value || 'Uden titel'), renderDoc(ta.value, refs, { teacher: true }));
    const w = wordsIn(ta.value);
    counter.textContent = `${w} ord · ca. ${readMinutes(w)} min. læsning`;
    status.textContent = dirty() ? '● Ikke gemt' : `Gemt ${fmtDateTime(c.updatedAt)}`;
    status.classList.toggle('unsaved', dirty());
  }
  let t;
  const schedule = () => { clearTimeout(t); t = setTimeout(refresh, 250); };
  ta.addEventListener('input', schedule); titleIn.addEventListener('input', schedule);

  async function save(extra = {}, quiet = false) {
    try {
      const r = await api('PUT', `/api/chapters/${c.id}`, { title: titleIn.value, content: ta.value, ...extra });
      saved = { title: titleIn.value, content: ta.value }; c.updatedAt = r.updatedAt; ready = r.ready; c.status = r.status;
      if (!quiet) toast('Kapitlet er gemt');

// ---------- Import af PDF, Word og tekst ----------
function htmlToMarkdown(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  const inline = (n) => [...n.childNodes].map((x) => x.nodeType === 3 ? x.nodeValue : x.nodeName === 'STRONG' || x.nodeName === 'B' ? `**${inline(x)}**` : x.nodeName === 'EM' || x.nodeName === 'I' ? `*${inline(x)}*` : inline(x)).join('');
  for (const el of doc.body.children) {
    const t = el.nodeName;
    if (/^H[1-6]$/.test(t)) out.push('#'.repeat(Math.min(Number(t[1]), 3)) + ' ' + el.textContent.trim());
    else if (t === 'UL' || t === 'OL') out.push([...el.children].map((li, i) => (t === 'OL' ? `${i + 1}. ` : '- ') + inline(li).trim()).join('\n'));
    else if (t === 'TABLE') {
      const rows = [...el.querySelectorAll('tr')].map((tr) => [...tr.children].map((td) => td.textContent.trim().replace(/\|/g, '/')));
      if (rows.length) out.push([`| ${rows[0].join(' | ')} |`, `|${rows[0].map(() => '---').join('|')}|`, ...rows.slice(1).map((r) => `| ${r.join(' | ')} |`)].join('\n'));
    } else { const s = inline(el).trim(); if (s) out.push(s); }
  }
  return out.join('\n\n');
}
async function extractText(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.docx')) {
    await loadScript(LIB.mammoth);
    const r = await window.mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
    return htmlToMarkdown(r.value);
  }
  if (name.endsWith('.pdf')) {
    await loadScript(LIB.pdfjs);
    const lib = window.pdfjsLib;
    lib.GlobalWorkerOptions.workerSrc = LIB.pdfworker;
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const tc = await (await pdf.getPage(p)).getTextContent();
      // Saml tekststumper til linjer ud fra deres lodrette position
      const lines = []; let y = null, cur = '';
      for (const it of tc.items) {
        const ny = it.transform ? Math.round(it.transform[5]) : y;
        if (y !== null && ny !== y) { lines.push(cur.trim()); cur = ''; }
        cur += it.str + (it.hasEOL ? '' : ''); y = ny;
      }
      if (cur.trim()) lines.push(cur.trim());
      pages.push(lines.join('\n'));
    }
    return pages.join('\n\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n');
  }
  return file.text();
}
// Del teksten i kapitler ud fra overskrifter (markdown, nummererede eller "Kapitel 3")
function splitChapters(text) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const isHeading = (l) => {
    const s = l.trim();
    if (!s || s.length > 90) return null;
    let m;
    if ((m = /^(#{1,3})\s+(.+)$/.exec(s))) return { level: m[1].length >= 2 && /^#{2}/.test(s) && lines.some((x) => /^#\s/.test(x.trim())) ? 2 : 1, title: m[2] };
    if ((m = /^(kapitel|afsnit)\s+(\d+)[.:]?\s*(.*)$/i.exec(s))) return { level: 1, title: s };
    if ((m = /^(\d+)\.(\d+)\.?\s+([A-ZÆØÅ].{2,})$/.exec(s))) return { level: 2, title: s };
    if ((m = /^(\d+)\.?\s+([A-ZÆØÅ][^.!?]{2,})$/.exec(s)) && !/[.,;:]$/.test(s)) return { level: 1, title: s };
    if (/^[A-ZÆØÅ0-9][A-ZÆØÅ0-9 ,\-–]{4,60}$/.test(s) && /[A-ZÆØÅ]{3}/.test(s)) return { level: 1, title: s.charAt(0) + s.slice(1).toLowerCase() };
    return null;
  };
  const chapters = []; let cur = null;
  for (const l of lines) {
    const hd = isHeading(l);
    if (hd) { cur = { title: hd.title.replace(/^#+\s*/, ''), level: hd.level, lines: [] }; chapters.push(cur); continue; }
    if (!cur) { cur = { title: 'Indledning', level: 1, lines: [] }; chapters.push(cur); }
    cur.lines.push(l);
  }
  return chapters.map((c) => ({ title: c.title.slice(0, 200), level: c.level, content: c.lines.join('\n').trim(), include: true })).filter((c) => c.content || c.title);
}
// Find henvisninger i importeret tekst, som bør kobles til retskilder og formler
function detectRefs(text) {
  const rules = (text.match(/\bregel\s+\d+/gi) || []).length;
  const paragraphs = (text.match(/§\s*\d+/g) || []).length;
  const conventions = (text.match(/\b(SOLAS|MARPOL|STCW|COLREG|ISM|ISPS|MLC)\b/g) || []).length;
  const formulas = (text.split('\n').filter((l) => /^[A-Za-zΔθ][\w₀-₉]*\s*=\s*[^=]+$/.test(l.trim()) && l.length < 80)).length;
  return { rules, paragraphs, conventions, formulas };
}
