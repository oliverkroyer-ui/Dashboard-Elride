<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Marstal Navigationsskole Portal</title>
<style>
:root {
  --navy: #0b2e4f;
  --navy-2: #134a7a;
  --gold: #f2c14e;
  --bg: #f3f5f8;
  --card: #ffffff;
  --text: #1b2430;
  --muted: #5d6b7c;
  --line: #dde3ea;
  --ok: #2a7f62;
  --warn: #b7791f;
  --bad: #b23a48;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(11, 46, 79, .06), 0 4px 14px rgba(11, 46, 79, .06);
  --accent: var(--navy-2);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
}
a { color: var(--navy-2); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .75rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

/* Topbar */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
  background: var(--navy); color: #fff; padding: .6rem 1.25rem;
}
.brand { display: flex; align-items: center; gap: .6rem; color: #fff; text-decoration: none; font-weight: 700; }
.topnav { display: flex; gap: .25rem; flex: 1; flex-wrap: wrap; }
.topnav a { color: #d6e2ee; text-decoration: none; padding: .35rem .7rem; border-radius: 6px; }
.topnav a:hover, .topnav a.active { background: rgba(255,255,255,.12); color: #fff; }
.userbox { display: flex; align-items: center; gap: .6rem; font-size: .9rem; }
.role-badge { background: var(--gold); color: var(--navy); font-weight: 700; font-size: .75rem; padding: .15rem .5rem; border-radius: 99px; text-transform: uppercase; letter-spacing: .03em; }

.container { max-width: 1150px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

/* Cards & grids */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.1rem 1.2rem; }
.grid { display: grid; gap: 1rem; }
.grid.subjects { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 800px) { .grid.two { grid-template-columns: 1fr; } }
.stack > * + * { margin-top: .75rem; }

.subject-card { display: block; text-decoration: none; color: inherit; border-top: 5px solid var(--accent); transition: transform .1s ease, box-shadow .1s ease; }
.subject-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(11,46,79,.12); }
.subject-card .code { font-weight: 800; font-size: .75rem; letter-spacing: .08em; color: var(--accent); }
.subject-card h3 { margin-top: .2rem; }
.subject-card .meta { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }

.pill { display: inline-block; font-size: .78rem; padding: .12rem .55rem; border-radius: 99px; background: #eef2f6; color: var(--muted); }
.pill.warn { background: #fdf3e1; color: var(--warn); }
.pill.ok { background: #e3f3ec; color: var(--ok); }
.pill.bad { background: #f9e5e8; color: var(--bad); }

.hero {
  background: linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff;
  border-radius: var(--radius); padding: 1.4rem 1.5rem; margin-bottom: 1.25rem;
}
.hero p { color: #d6e2ee; margin: 0; }
.subject-hero { background: var(--accent); }

.section-title { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 1.5rem 0 .75rem; }
.section-title h2 { margin: 0; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: .7rem 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
.empty { color: var(--muted); font-style: italic; }

/* Tabs */
.tabs { display: flex; gap: .25rem; border-bottom: 2px solid var(--line); margin-bottom: 1rem; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: .6rem 1rem; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

/* Forms */
form.form { display: grid; gap: .7rem; }
label { display: grid; gap: .25rem; font-weight: 600; font-size: .88rem; }
input, textarea, select {
  font: inherit; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--text); width: 100%;
}
textarea { min-height: 110px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--navy-2); outline-offset: 1px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  font: inherit; font-weight: 600; padding: .5rem 1rem; border-radius: 7px; border: 1px solid transparent;
  background: var(--navy-2); color: #fff; cursor: pointer; text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: currentColor; color: inherit; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.small { padding: .25rem .6rem; font-size: .82rem; }
.btn[disabled] { opacity: .5; cursor: default; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; }
details.creator > summary { cursor: pointer; font-weight: 600; color: var(--navy-2); list-style: none; }
details.creator > summary::-webkit-details-marker { display: none; }
details.creator[open] > summary { margin-bottom: .75rem; }

/* Login */
.login-wrap { min-height: 90vh; display: grid; place-items: center; }
.login-card { width: min(430px, 100%); }
.login-card .logo { display: flex; align-items: center; gap: .7rem; margin-bottom: 1rem; }
.login-card .logo h1 { font-size: 1.25rem; margin: 0; }
.role-switch { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: .5rem; }
.role-switch button { padding: .6rem; border: 1px solid var(--line); background: #fff; border-radius: 7px; font: inherit; cursor: pointer; }
.role-switch button.active { border-color: var(--navy-2); background: #eaf1f8; font-weight: 700; }
.demo { margin-top: 1rem; font-size: .82rem; color: var(--muted); background: #f6f8fa; padding: .6rem .8rem; border-radius: 7px; }
.error { color: var(--bad); font-size: .9rem; min-height: 1.2em; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: #f6f8fa; font-weight: 600; white-space: nowrap; }
td.grade { font-weight: 700; text-align: center; }

.submission-text { white-space: pre-wrap; background: #f6f8fa; border-radius: 7px; padding: .6rem .8rem; margin: .5rem 0; }
.grade-big { font-size: 1.6rem; font-weight: 800; color: var(--navy); }
.prewrap { white-space: pre-wrap; }

.toast {
  position: fixed; right: 1rem; bottom: 1rem; background: var(--navy); color: #fff;
  padding: .7rem 1rem; border-radius: 8px; box-shadow: var(--shadow); max-width: 360px;
}
.toast.error { background: var(--bad); }

[hidden] { display: none !important; }
label { align-content: start; }
.card > h2:not(:first-child) { margin-top: 1.25rem; }
.center { text-align: center; }
.bullets { margin: 0; padding-left: 1.2rem; }
.bullets li { margin: .2rem 0; }
.spaced { margin-top: 1.5rem; }

.badge { display: inline-block; min-width: 1.3em; margin-left: .35rem; padding: 0 .4rem; border-radius: 99px; background: var(--gold); color: var(--navy); font-size: .75rem; font-weight: 800; text-align: center; }
.grid.three { display: grid; gap: .7rem; grid-template-columns: repeat(3, 1fr); }
.lesson { border-left: 4px solid var(--accent); padding-left: .7rem !important; margin: .4rem 0; border-bottom: 0 !important; }
.week { display: grid; gap: .8rem; grid-template-columns: repeat(5, 1fr); }
.week .day.today { outline: 2px solid var(--gold); }
.week .day h3 { display: flex; justify-content: space-between; align-items: center; }
@media (max-width: 900px) { .week { grid-template-columns: 1fr; } .grid.three { grid-template-columns: 1fr; } }
.msg-layout { display: grid; gap: 1rem; grid-template-columns: 300px 1fr; align-items: start; }
@media (max-width: 800px) { .msg-layout { grid-template-columns: 1fr; } }
.threads li { padding: 0; }
.threads li.selected { background: #eaf1f8; border-radius: 7px; }
.thread { display: block; padding: .6rem .5rem; color: inherit; text-decoration: none; }
.convo { display: grid; gap: .8rem; }
.messages { display: flex; flex-direction: column; gap: .5rem; max-height: 55vh; overflow-y: auto; padding: .5rem; background: #f6f8fa; border-radius: 8px; }
.msg { max-width: 75%; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: .5rem .75rem; align-self: flex-start; }
.msg.mine { align-self: flex-end; background: var(--navy-2); color: #fff; border-color: var(--navy-2); }
.msg .meta { opacity: .7; margin-top: .2rem; }
.compose textarea { min-height: 70px; }

/* ===================== App-skal ===================== */
html { -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; }
.icon { flex: none; vertical-align: -0.2em; }
.btn .icon, .pill .icon { margin-right: .1rem; }
.topbar { padding-top: max(.6rem, env(safe-area-inset-top, 0px)); padding-left: max(1.25rem, env(safe-area-inset-left, 0px)); padding-right: max(1.25rem, env(safe-area-inset-right, 0px)); }
.topnav a { display: inline-flex; align-items: center; gap: .4rem; }
.avatar { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--gold); color: var(--navy); font-weight: 800; font-size: .8rem; }
#app { animation: page-in .18s ease-out; }
@keyframes page-in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #app { animation: none; } .subject-card, .book-cover { transition: none; } }
.tabbar { display: none; }
@media (max-width: 860px) {
  .topnav, .user-name, .brand-text { display: none; }
  .topbar { justify-content: space-between; }
  .userbox { margin-left: auto; }
  body.signed-in .container { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px)); }
  .tabbar { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around;
    background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(11,46,79,.06);
    padding: .35rem max(.25rem, env(safe-area-inset-right, 0px)) calc(.35rem + env(safe-area-inset-bottom, 0px)) max(.25rem, env(safe-area-inset-left, 0px)); }
  .tabbar[hidden] { display: none; }
  .tabbar a { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .3rem .1rem;
    color: var(--muted); text-decoration: none; font-size: .68rem; font-weight: 600; border-radius: 10px; min-width: 0; }
  .tabbar a span:not(.badge) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tabbar a.active { color: var(--navy-2); background: #eaf1f8; }
  .tabbar .badge { position: absolute; top: 0; right: calc(50% - 22px); margin: 0; }
  .toast { bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); left: 1rem; right: 1rem; max-width: none; }
  .hero { padding: 1.1rem 1.1rem; }
  h1 { font-size: 1.35rem; }
}
.btn.on-dark { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.4); color: #fff; }
.hero-back { color: #fff; }
.code { font-weight: 800; font-size: .75rem; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
.edit-form { border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(19,74,122,.12); }

/* ===================== Lærebøger ===================== */
.grid.books { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.book { display: flex; flex-direction: column; gap: .5rem; }
.book-cover { display: flex; min-height: 190px; background: var(--card); border: 1px solid var(--line); border-radius: 6px 12px 12px 6px;
  box-shadow: var(--shadow); text-decoration: none; color: inherit; overflow: hidden; transition: transform .12s ease, box-shadow .12s ease; }
.book-cover:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(11,46,79,.14); }
.book-spine { width: 16px; flex: none; background: linear-gradient(90deg, rgba(0,0,0,.18), transparent 60%), var(--accent); }
.book-body { padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
.book-body h3 { font-size: 1.08rem; margin: 0; }
.book-body .meta { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: auto; padding-top: .4rem; }
.book-actions { display: flex; gap: .5rem; }
.progress { height: 6px; background: #e6ebf1; border-radius: 99px; overflow: hidden; min-width: 60px; }
.progress span { display: block; height: 100%; background: var(--ok); border-radius: 99px; }

.reader-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 1.25rem; align-items: start; }
@media (max-width: 860px) { .reader-layout { grid-template-columns: 1fr; } }
.toc { position: sticky; top: 5rem; display: grid; gap: .6rem; }
@media (max-width: 860px) { .toc { position: static; } }
.toc h2 { margin: 0; }
.toc-list { list-style: none; counter-reset: ch; margin: 0; padding: 0; display: grid; gap: .15rem; }
.toc-list li { counter-increment: ch; }
.toc-list a { display: flex; align-items: center; gap: .5rem; padding: .45rem .55rem; border-radius: 7px; color: var(--text); text-decoration: none; font-size: .92rem; }
.toc-list a::before { content: counter(ch); flex: none; width: 1.5rem; height: 1.5rem; display: grid; place-items: center; border-radius: 50%; background: #eef2f6; color: var(--muted); font-size: .75rem; font-weight: 700; }
.toc-list a span:first-of-type { flex: 1; min-width: 0; }
.toc-list li.current a { background: #eaf1f8; font-weight: 600; }
.toc-list li.current a::before { background: var(--accent); color: #fff; }
.toc-check { color: var(--ok); display: inline-flex; }
.reader { border-top: 5px solid var(--accent); padding: 1.5rem clamp(1.1rem, 4vw, 2.5rem); }
.reader > h1 { font-size: 1.9rem; margin-top: .3rem; text-wrap: balance; }
.lead { font-size: 1.1rem; color: var(--muted); }
.reader-nav { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }

.md { font-size: 1.02rem; line-height: 1.7; max-width: 68ch; }
.md h2, .md h3, .md h4, .md h5 { margin: 1.6rem 0 .5rem; }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md .table-wrap { margin: 0 0 1rem; }
.md ul, .md ol { padding-left: 1.4rem; }
.md li { margin: .25rem 0; }
.md blockquote { border-left: 4px solid var(--gold); background: #fdf8ea; padding: .6rem .9rem; border-radius: 0 8px 8px 0; }
.md code { background: #eef2f6; padding: .1rem .35rem; border-radius: 4px; font-size: .9em; }
.md pre { background: var(--navy); color: #e8eef5; padding: .9rem 1rem; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; color: inherit; }
.md img { max-width: 100%; border-radius: 8px; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.5rem 0; }
.md table { font-size: .95rem; }

/* Bog-editor */
.editor-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 860px) { .editor-grid { grid-template-columns: 1fr; } }
.chapter-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.chapter-row { display: flex; align-items: center; gap: .75rem; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 9px; flex-wrap: wrap; }
.chapter-order { display: flex; flex-direction: column; gap: 2px; }
.chapter-info { flex: 1; min-width: 160px; }
.chapter-info a { color: var(--text); text-decoration: none; }
.icon-btn { display: grid; place-items: center; width: 28px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); cursor: pointer; padding: 0; }
.icon-btn[disabled] { opacity: .3; cursor: default; }
.inline-form { display: flex; gap: .5rem; flex-wrap: wrap; }
.inline-form input { flex: 1; min-width: 180px; }
.danger-zone { border-color: #efd0d5; }

/* Kapitel-editor */
.editor-head { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin: .5rem 0 1rem; }
.title-input { flex: 1; min-width: 220px; font-size: 1.4rem; font-weight: 700; border: 1px solid transparent; background: transparent; padding: .3rem .5rem; }
.title-input:hover, .title-input:focus { border-color: var(--line); background: #fff; }
.save-status.unsaved { color: var(--warn); font-weight: 600; }
.md-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
.md-pane { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 60vh; overflow: hidden; }
.md-toolbar { display: flex; flex-wrap: wrap; gap: .25rem; padding: .45rem; border-bottom: 1px solid var(--line); background: #f6f8fa; }
.md-toolbar button { font: inherit; font-size: .82rem; font-weight: 700; min-width: 34px; padding: .3rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; color: var(--text); }
.md-toolbar button:hover { border-color: var(--navy-2); color: var(--navy-2); }
.md-input { flex: 1; border: 0; border-radius: 0; resize: none; min-height: 55vh; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92rem; line-height: 1.6; padding: 1rem; }
.md-input:focus { outline: none; }
.preview-pane { padding: 1rem 1.4rem; overflow-y: auto; max-height: 75vh; }
.mode-tabs { display: none; }
@media (max-width: 860px) {
  .mode-tabs { display: flex; }
  .md-split { grid-template-columns: 1fr; }
  .md-split.show-write .preview-pane, .md-split.show-preview .md-pane:not(.preview-pane) { display: none; }
}
.editor-foot { margin-top: .6rem; flex-wrap: wrap; }
.history { margin-top: 1rem; }
.history > summary { cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: .4rem; }
.revision-view { background: #fbfcfd; }

/* ===================== Lærerstudio ===================== */
.studio-hero { background: linear-gradient(120deg, #0b2e4f 0%, #134a7a 70%, #1d6f7a 100%); }
.studio-badge { display: inline-flex; align-items: center; gap: .4rem; background: rgba(255,255,255,.14); padding: .25rem .7rem; border-radius: 99px; font-size: .8rem; font-weight: 700; margin-bottom: .6rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; text-decoration: none; color: inherit; }
a.stat:hover { border-color: var(--navy-2); }
.stat-value { font-size: 1.7rem; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-label { font-weight: 600; }
.studio-table td { vertical-align: middle; }
.studio-table td.num { font-variant-numeric: tabular-nums; }
.studio-table .progress { width: 80px; display: inline-block; vertical-align: middle; margin-right: .4rem; }
.subject-edit { border-left: 5px solid var(--accent); }
.subject-edit h3 { margin: .1rem 0 0; }
.activity li { padding: .55rem 0; }
.studio-card { display: flex; gap: .9rem; align-items: center; text-decoration: none; color: inherit; border-left: 5px solid var(--gold); }
.studio-card .icon { color: var(--navy-2); }
.reading-item { display: grid; gap: .35rem; color: inherit; text-decoration: none; }
input[type=color] { padding: .2rem; height: 2.5rem; }
.role-switch button { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
.pill { white-space: nowrap; }
.actions { align-items: center; }
form.inline-form { display: flex; }
label input, label textarea, label select { font-weight: 400; }


.demo-bar { display: flex; gap: .75rem; align-items: center; justify-content: center; flex-wrap: wrap;
  padding: .35rem max(16px, env(safe-area-inset-right, 0px)) .35rem max(16px, env(safe-area-inset-left, 0px));
  background: var(--gold); color: var(--navy); font-size: .8rem; font-weight: 600; }
.demo-bar .btn { color: var(--navy); }

</style>

Søkortet er navigatørens vigtigste værktøj. Det viser **dybder**, **kystlinje**, **afmærkning** og **farer** – og danner grundlaget for al planlægning af en rejse.

### Mercators projektion
De fleste søkort er tegnet i *Mercators projektion*. Fordelen er, at en ret linje på kortet er en **loksodrom** – en kurs, der skærer alle meridianer under samme vinkel. Derfor kan en kurs aflæses direkte med transportør eller kursvinkel.

- **Deviation** – skibets egen påvirkning af kompasset. Aflæses i skibets *deviationstabel* og afhænger af kursen.

Magnetisk kurs    = Kompaskurs + deviation

Kompaskurs 085°, deviation 2° Ø, misvisning 3° V:

1. Magnetisk kurs = 085° + 2° = 087°
2. Rettevisende kurs = 087° − 3° = **084°**

> Huskeregel: *"Fra kompas til kort – læg østlig til."*

### Trekantens tre sider
1. **Strømvektoren** – strømmens retning og fart i én time.
2. **Skibets fart gennem vandet** – afsat fra strømvektorens ende til kurslinjen.
3. **Kurs og fart over grunden (KOG/FOG)** – resultatet.

### Fremgangsmåde
1. Tegn kurslinjen fra position til mål.
2. Afsæt strømmen fra startpunktet.
3. Slå en cirkelbue med radius = skibets fart fra strømvektorens ende til kurslinjen.
4. Retningen fra strømvektorens ende til skæringspunktet er den **kurs der skal styres**.

- **Regel 7 – Kollisionsfare:** Ændrer et andet skibs kompaspejling sig ikke mærkbart, mens afstanden mindskes, er der kollisionsfare.
- **Regel 8 – Manøvre:** Manøvren skal foretages i god tid, være *tydelig* og stor nok til at blive opdaget af det andet skib.

### Regel 15 i praksis

'use strict';

function createApi(env) {
  // env: { hashPassword, verifyPassword, randomHex, load() -> db|null, save(db), seed(hashPassword) -> db }
  let db;
  const sessions = new Map(); // token -> { userId, expires }
  const newId = (prefix) => `${prefix}${env.randomHex(6)}`;
  const saveDb = () => env.save(db);
  function loadDb(reset = false) {
    db = reset ? null : env.load();
    if (db) { for (const k of ['lessons', 'messages', 'books', 'chapters', 'reads', 'activity']) db[k] = db[k] || []; }
    else { db = env.seed(env.hashPassword); saveDb(); }
  }
  const hashPassword = env.hashPassword, verifyPassword = env.verifyPassword;
  const reply = (status, data, extra = {}) => ({ status, data, ...extra });
  function userFromSid(sid) {
    const s = sid && sessions.get(sid);
    if (!s || s.expires < Date.now()) { if (s) sessions.delete(sid); return null; }
    s.expires = Date.now() + SESSION_TTL_MS;
    return db.users.find((u) => u.id === s.userId) || null;
  }

const SESSION_TTL_MS = 8 * 60 * 60 * 1000; // 8 timer
const GRADES = ['12', '10', '7', '4', '02', '00', '-3']; // 7-trinsskalaen

const publicUser = (u) => u && ({ id: u.id, username: u.username, name: u.name, role: u.role, className: u.className || null });

// ---------- Hjælpere ----------
class HttpError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
function str(v, field, { max = 5000, required = true } = {}) {
  const s = typeof v === 'string' ? v.trim() : '';
  if (required && !s) throw new HttpError(400, `Feltet "${field}" skal udfyldes`);
  if (s.length > max) throw new HttpError(400, `Feltet "${field}" er for langt`);
  return s;
}
function safeLink(v) {
  const s = str(v, 'link', { max: 500, required: false });
  if (s && !/^https?:\/\//i.test(s)) throw new HttpError(400, 'Link skal starte med http:// eller https://');
  return s;
}
function requireRole(user, role) {
  if (!user) throw new HttpError(401, 'Du skal være logget ind');
  if (role && user.role !== role) throw new HttpError(403, 'Du har ikke adgang til dette');
}
function subjectFor(user, subjectId) {
  const s = db.subjects.find((x) => x.id === subjectId);
  if (!s) throw new HttpError(404, 'Faget findes ikke');
  const member = user.role === 'teacher' ? s.teacherIds.includes(user.id) : s.studentIds.includes(user.id);
  if (!member) throw new HttpError(403, 'Du er ikke tilknyttet dette fag');
  return s;
}
function mySubjects(user) {
  return db.subjects.filter((s) => (user.role === 'teacher' ? s.teacherIds : s.studentIds).includes(user.id));
}
const nameOf = (id) => (db.users.find((u) => u.id === id) || {}).name || 'Ukendt';
const byDateDesc = (k) => (a, b) => (b[k] || '').localeCompare(a[k] || '');

function subjectSummary(s, user) {
  const assignments = db.assignments.filter((a) => a.subjectId === s.id);
  const base = {
    id: s.id, code: s.code, name: s.name, color: s.color, description: s.description,
    teachers: s.teacherIds.map(nameOf),
    materialCount: db.materials.filter((m) => m.subjectId === s.id).length,
    assignmentCount: assignments.length,
  };
  if (user.role === 'teacher') {
    base.studentCount = s.studentIds.length;
    base.ungraded = db.submissions.filter((x) => x.grade == null && assignments.some((a) => a.id === x.assignmentId)).length;
  } else {
    const mine = db.submissions.filter((x) => x.studentId === user.id && assignments.some((a) => a.id === x.assignmentId));
    base.openAssignments = assignments.filter((a) => !mine.some((m) => m.assignmentId === a.id)).length;
  }
  return base;
}

function assignmentView(a, user, subject) {
  const out = { ...a, author: nameOf(a.authorId) };
  if (user.role === 'student') {
    const sub = db.submissions.find((x) => x.assignmentId === a.id && x.studentId === user.id);
    out.mySubmission = sub || null;
  } else {
    const subs = db.submissions.filter((x) => x.assignmentId === a.id);
    out.submissionCount = subs.length;
    out.ungraded = subs.filter((x) => x.grade == null).length;
    out.studentCount = subject.studentIds.length;
  }
  return out;
}

// ---------- API-ruter ----------
const routes = [];
const route = (method, pattern, handler) => {
  const keys = [];
  const re = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '$');
  routes.push({ method, re, keys, handler });
};

route('POST', '/api/login', ({ body }) => {
  const username = str(body.username, 'brugernavn', { max: 100 }).toLowerCase();
  const password = str(body.password, 'adgangskode', { max: 200 });
  const user = db.users.find((u) => u.username === username);
  if (!user || !verifyPassword(password, user.password)) throw new HttpError(401, 'Forkert brugernavn eller adgangskode');
  const token = env.randomHex(32);
  sessions.set(token, { userId: user.id, expires: Date.now() + SESSION_TTL_MS });
  return reply(200, { user: publicUser(user) }, { sid: token });
});

route('POST', '/api/logout', ({ sid }) => {
  if (sid) sessions.delete(sid);
  return reply(200, { ok: true }, { clearSid: true });
});

route('GET', '/api/me', ({ user }) => {
  requireRole(user);
  return reply(200, { user: publicUser(user), grades: GRADES });
});

route('GET', '/api/dashboard', ({ user }) => {
  requireRole(user);
  const subs = mySubjects(user);
  const subjectIds = new Set(subs.map((s) => s.id));
  const subjectName = (id) => (db.subjects.find((s) => s.id === id) || {}).name;
  const announcements = db.announcements.filter((n) => subjectIds.has(n.subjectId)).sort(byDateDesc('createdAt')).slice(0, 5)
    .map((n) => ({ ...n, subjectName: subjectName(n.subjectId), author: nameOf(n.authorId) }));
  const assignments = db.assignments.filter((a) => subjectIds.has(a.subjectId));
  const today = ((new Date().getDay() + 6) % 7) + 1; // 1 = mandag … 7 = søndag
  const out = {
    subjects: subs.map((s) => subjectSummary(s, user)), announcements,
    today, todayLessons: lessonsFor(user).filter((l) => l.weekday === today),
    unreadMessages: db.messages.filter((m) => m.toId === user.id && !m.read).length,
  };

  if (user.role === 'student') {
    const mine = db.submissions.filter((x) => x.studentId === user.id);
    out.upcoming = assignments.filter((a) => !mine.some((m) => m.assignmentId === a.id))
      .sort((a, b) => a.due.localeCompare(b.due))
      .map((a) => ({ ...a, subjectName: subjectName(a.subjectId) }));
    out.grades = mine.filter((x) => x.grade != null).sort(byDateDesc('gradedAt')).map((x) => {
      const a = db.assignments.find((y) => y.id === x.assignmentId) || {};
      return { ...x, assignmentTitle: a.title, subjectId: a.subjectId, subjectName: subjectName(a.subjectId) };
    });
  } else {
    out.toGrade = db.submissions.filter((x) => x.grade == null && assignments.some((a) => a.id === x.assignmentId))
      .sort((a, b) => a.submittedAt.localeCompare(b.submittedAt))
      .map((x) => {
        const a = assignments.find((y) => y.id === x.assignmentId);
        return { ...x, studentName: nameOf(x.studentId), assignmentTitle: a.title, subjectId: a.subjectId, subjectName: subjectName(a.subjectId) };
      });
  }
  return reply(200, out);
});

route('GET', '/api/subjects/:id', ({ user, params }) => {
  requireRole(user);
  const s = subjectFor(user, params.id);
  const out = {
    ...subjectSummary(s, user),
    materials: db.materials.filter((m) => m.subjectId === s.id).sort(byDateDesc('createdAt')).map((m) => ({ ...m, author: nameOf(m.authorId) })),
    assignments: db.assignments.filter((a) => a.subjectId === s.id).sort((a, b) => a.due.localeCompare(b.due)).map((a) => assignmentView(a, user, s)),
    announcements: db.announcements.filter((n) => n.subjectId === s.id).sort(byDateDesc('createdAt')).map((n) => ({ ...n, author: nameOf(n.authorId) })),
    books: db.books.filter((b) => b.subjectId === s.id && (user.role === 'teacher' || b.published)).map((b) => bookSummary(user, b)),
  };
  if (user.role === 'teacher') {
    out.students = s.studentIds.map((id) => publicUser(db.users.find((u) => u.id === id))).filter(Boolean);
  }
  return reply(200, out);
});

// Lærer: slet indhold
for (const [coll, label] of [['materials', 'Materialet'], ['assignments', 'Opgaven'], ['announcements', 'Opslaget']]) {
  route('DELETE', `/api/${coll}/:id`, ({ user, params }) => {
    requireRole(user, 'teacher');
    const item = db[coll].find((x) => x.id === params.id);
    if (!item) throw new HttpError(404, `${label} findes ikke`);
    subjectFor(user, item.subjectId);
    db[coll] = db[coll].filter((x) => x.id !== item.id);
    if (coll === 'assignments') db.submissions = db.submissions.filter((x) => x.assignmentId !== item.id);
    saveDb();
    return reply(200, { ok: true });
  });
}

// Elev: aflever opgave (kan genafleveres indtil den er bedømt)
route('POST', '/api/assignments/:id/submissions', ({ user, params, body }) => {
  requireRole(user, 'student');
  const a = db.assignments.find((x) => x.id === params.id);
  if (!a) throw new HttpError(404, 'Opgaven findes ikke');
  subjectFor(user, a.subjectId);
  const text = str(body.text, 'besvarelse', { max: 20000 });
  let sub = db.submissions.find((x) => x.assignmentId === a.id && x.studentId === user.id);
  if (sub && sub.grade != null) throw new HttpError(409, 'Opgaven er allerede bedømt og kan ikke ændres');
  if (sub) { sub.text = text; sub.submittedAt = new Date().toISOString(); }
  else {
    sub = { id: newId('sub'), assignmentId: a.id, studentId: user.id, text, submittedAt: new Date().toISOString(), grade: null, feedback: '', gradedAt: null };
    db.submissions.push(sub);
  }
  saveDb();
  return reply(201, sub);
});

route('POST', '/api/submissions/:id/grade', ({ user, params, body }) => {
  requireRole(user, 'teacher');
  const sub = db.submissions.find((x) => x.id === params.id);

route('GET', '/api/subjects/:id/gradebook', ({ user, params }) => {
  requireRole(user, 'teacher');
  const s = subjectFor(user, params.id);
  const assignments = db.assignments.filter((a) => a.subjectId === s.id).sort((a, b) => a.due.localeCompare(b.due));
  const rows = s.studentIds.map((sid) => ({
    student: publicUser(db.users.find((u) => u.id === sid)),
    cells: assignments.map((a) => {

    }),

});

// ---------- Skema ----------
const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function lessonsFor(user) {
  const subs = mySubjects(user);
  return db.lessons.filter((l) => subs.some((s) => s.id === l.subjectId))
    .map((l) => {
      const s = subs.find((x) => x.id === l.subjectId);
      return { ...l, subjectName: s.name, subjectCode: s.code, color: s.color, teacher: nameOf(l.teacherId) };
    })
    .sort((a, b) => a.weekday - b.weekday || a.start.localeCompare(b.start));
}
route('GET', '/api/schedule', ({ user }) => {
  requireRole(user);
  return reply(200, { lessons: lessonsFor(user) });
});
route('POST', '/api/subjects/:id/lessons', ({ user, params, body }) => {
  requireRole(user, 'teacher');
  const s = subjectFor(user, params.id);
  const weekday = Number(body.weekday);
  if (!(weekday >= 1 && weekday <= 5)) throw new HttpError(400, 'Vælg en ugedag (mandag–fredag)');
  const start = str(body.start, 'starttid', { max: 5 }), end = str(body.end, 'sluttid', { max: 5 });
  if (!TIME_RE.test(start) || !TIME_RE.test(end) || end <= start) throw new HttpError(400, 'Ugyldigt tidsrum');
  const l = { id: newId('l'), subjectId: s.id, weekday, start, end, room: str(body.room, 'lokale', { max: 80, required: false }), teacherId: user.id };
  db.lessons.push(l); saveDb();
  return reply(201, l);
});
route('DELETE', '/api/lessons/:id', ({ user, params }) => {
  requireRole(user, 'teacher');
  const l = db.lessons.find((x) => x.id === params.id);
  if (!l) throw new HttpError(404, 'Lektionen findes ikke');
  subjectFor(user, l.subjectId);
  db.lessons = db.lessons.filter((x) => x.id !== l.id); saveDb();
  return reply(200, { ok: true });
});

// ---------- Beskeder (elev ↔ lærer i fælles fag) ----------
function contactsOf(user) {
  const ids = new Set();
  for (const s of mySubjects(user)) (user.role === 'teacher' ? s.studentIds : s.teacherIds).forEach((id) => ids.add(id));
  ids.delete(user.id);
  return [...ids].map((id) => db.users.find((u) => u.id === id)).filter(Boolean);
}
route('GET', '/api/messages', ({ user }) => {
  requireRole(user);
  const threads = contactsOf(user).map((c) => {
    const msgs = db.messages.filter((m) => (m.fromId === user.id && m.toId === c.id) || (m.fromId === c.id && m.toId === user.id))
      .sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    return {
      contact: publicUser(c),
      subjects: mySubjects(user).filter((s) => [...s.teacherIds, ...s.studentIds].includes(c.id)).map((s) => s.name),
      unread: msgs.filter((m) => m.toId === user.id && !m.read).length,
      last: msgs[msgs.length - 1] || null,
      messages: msgs.map((m) => ({ ...m, mine: m.fromId === user.id })),
    };
  }).sort((a, b) => (b.last ? b.last.createdAt : '').localeCompare(a.last ? a.last.createdAt : '') || a.contact.name.localeCompare(b.contact.name));
  return reply(200, { threads });
});
route('POST', '/api/messages', ({ user, body }) => {
  requireRole(user);
  const to = contactsOf(user).find((c) => c.id === body.toId);
  if (!to) throw new HttpError(403, 'Du kan kun skrive til dine lærere/elever');
  const m = { id: newId('msg'), fromId: user.id, toId: to.id, body: str(body.body, 'besked', { max: 5000 }), createdAt: new Date().toISOString(), read: false };
  db.messages.push(m); saveDb();
  return reply(201, m);
});
route('POST', '/api/messages/read/:contactId', ({ user, params }) => {
  requireRole(user);
  let n = 0;
  for (const m of db.messages) if (m.toId === user.id && m.fromId === params.contactId && !m.read) { m.read = true; n++; }
  if (n) saveDb();
  return reply(200, { ok: true, marked: n });
});

  // ---------- Lærebøger ----------
  const MAX_REVISIONS = 30;
  function canSeeBook(user, b) {
    subjectFor(user, b.subjectId);
    if (user.role !== 'teacher' && !b.published) throw new HttpError(404, 'Bogen findes ikke');
  }
  function bookOr404(id) {
    const b = db.books.find((x) => x.id === id);
    if (!b) throw new HttpError(404, 'Bogen findes ikke');
    return b;
  }
  function chapterOr404(id) {
    const c = db.chapters.find((x) => x.id === id);
    if (!c) throw new HttpError(404, 'Kapitlet findes ikke');
    return c;
  }
  function visibleChapters(user, bookId) {
    return db.chapters.filter((c) => c.bookId === bookId && (user.role === 'teacher' || c.published)).sort((a, b) => a.order - b.order);
  }
  function bookSummary(user, b) {
    const s = db.subjects.find((x) => x.id === b.subjectId) || {};
    const chs = visibleChapters(user, b.id);
    const out = {
      id: b.id, subjectId: b.subjectId, subjectName: s.name, subjectCode: s.code, color: s.color,
      title: b.title, description: b.description, published: b.published,
      chapterCount: chs.length, updatedAt: b.updatedAt, author: nameOf(b.authorId),
    };
    if (user.role === 'teacher') out.draftChapters = chs.filter((c) => !c.published).length;
    else out.readCount = chs.filter((c) => db.reads.some((r) => r.userId === user.id && r.chapterId === c.id)).length;
    return out;
  }
  function touchBook(user, b) { b.updatedAt = new Date().toISOString(); b.updatedBy = user.id; }

  route('GET', '/api/books', ({ user }) => {
    requireRole(user);
    const ids = new Set(mySubjects(user).map((s) => s.id));
    const books = db.books.filter((b) => ids.has(b.subjectId) && (user.role === 'teacher' || b.published))
      .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))
      .map((b) => bookSummary(user, b));
    return reply(200, { books });
  });
  route('POST', '/api/subjects/:id/books', ({ user, params, body }) => {
    requireRole(user, 'teacher');

    let m;
    if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) { flush(); const lvl = Math.min(m[1].length + 1, 5); out.push(`<h${lvl}>${mdInline(m[2])}</h${lvl}>`); continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flush(); out.push('<hr>'); continue; }
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      flush();
      const head = cells(line);
      const rows = [];
      for (i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(cells(lines[i]));
      i--;
      out.push(`<div class="table-wrap"><table><thead><tr>${head.map((c) => `<th>${mdInline(c)}</th>`).join('')}</tr></thead><tbody>${
        rows.map((r) => `<tr>${r.map((c) => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    if (/^&gt;\s?/.test(line)) {
      flush();
      const q = [];
      for (; i < lines.length && /^&gt;\s?/.test(lines[i]); i++) q.push(lines[i].replace(/^&gt;\s?/, ''));
      i--;
      out.push(`<blockquote>${mdInline(q.join(' '))}</blockquote>`);
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      flush();
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]); i++) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''));
      i--;
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>${items.map((it) => `<li>${mdInline(it)}</li>`).join('')}</${tag}>`);
      continue;
    }
    if (!line.trim()) { flush(); continue; }
    para.push(line.trim());
  }
  flush();
  return out.join('\n');
}

function md(src) {
  const div = document.createElement('div');
  div.className = 'md';
  div.innerHTML = mdToHtml(src);
  return div;
}

const MD_TOOLS = [
  ['H2', 'Overskrift', '\n## ', ''],
  ['H3', 'Underoverskrift', '\n### ', ''],
  ['B', 'Fed', '**', '**'],
  ['I', 'Kursiv', '*', '*'],
  ['•', 'Punktliste', '\n- ', ''],
  ['1.', 'Nummereret liste', '\n1. ', ''],
  ['❝', 'Citat / huskeregel', '\n> ', ''],
  ['{ }', 'Kode / formel', '\n```\n', '\n```\n'],
  ['Tabel', 'Tabel', '\n| Kolonne 1 | Kolonne 2 |\n|---|---|\n| ', ' |  |\n'],
  ['Link', 'Link', '[', '](https://)'],
  ['Billede', 'Billede (URL)', '![Beskrivelse](', 'https://)'],
];

async function viewChapterEditor(chapterId) {
  loading();
  const c = await api('GET', `/api/chapters/${chapterId}`);
  let saved = { title: c.title, content: c.content };
  let published = c.published;

  const titleIn = h('input.title-input', { value: c.title, 'aria-label': 'Kapitlets titel', required: true });
  const ta = h('textarea.md-input', { value: c.content, spellcheck: true, 'aria-label': 'Kapitlets tekst (markdown)' });
  const preview = h('div.md-preview');
  const status = h('span.save-status.small.muted');
  const counter = h('span.small.muted');
  const dirty = () => titleIn.value !== saved.title || ta.value !== saved.content;

  function refresh() {
    preview.replaceChildren(h('h1', titleIn.value || 'Uden titel'), md(ta.value));
    const w = wordsIn(ta.value);
    counter.textContent = `${w} ord · ca. ${readMinutes(w)} min. læsning`;
    status.textContent = dirty() ? '● Ikke gemt' : `Gemt ${fmtDateTime(c.updatedAt)}`;
    status.classList.toggle('unsaved', dirty());
  }
  let t;
  const schedule = () => { clearTimeout(t); t = setTimeout(refresh, 120); };
  ta.addEventListener('input', schedule); titleIn.addEventListener('input', schedule);

  async function save(extra = {}, quiet = false) {
    try {
      const r = await api('PUT', `/api/chapters/${c.id}`, { title: titleIn.value, content: ta.value, ...extra });
      saved = { title: titleIn.value, content: ta.value };
      c.updatedAt = r.updatedAt; published = r.published;
      api('GET', `/api/chapters/${c.id}`).then((fresh) => renderHistory(fresh.revisions, !!revisions.querySelector('details[open]'))).catch(() => {});
      if (!quiet) toast('Kapitlet er gemt');
      refresh(); updatePublish(); return true;
    } catch (e) { toast(e.message, true); return false; }
  }

  const insert = (before, after) => {
    const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
    ta.setRangeText(before + sel + after, s, e, 'end');
    if (!sel) ta.setSelectionRange(s + before.length, s + before.length);
    ta.focus(); schedule();
  };
  const toolbar = h('div.md-toolbar', { role: 'toolbar', 'aria-label': 'Formatering' },
    MD_TOOLS.map(([label, title, before, after]) => h('button', { type: 'button', title, 'aria-label': title, onclick: () => insert(before, after) }, label)));

  ta.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); insert('**', '**'); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'i') { e.preventDefault(); insert('*', '*'); }
  });

  const pubBtn = h('button.btn', { type: 'button', onclick: () => save({ published: !published }) });
  const statePill = h('span');
  function updatePublish() {
    pubBtn.textContent = published ? 'Gør til kladde' : 'Gem og udgiv';
    pubBtn.classList.toggle('ghost', published);
    statePill.replaceChildren(statusPill(published));
  }

  // Skift mellem skriv/forhåndsvis på smalle skærme
  const split = h('div.md-split', { class: 'show-write' },
    h('div.md-pane', toolbar, ta),
    h('div.md-pane.preview-pane', preview));
  const modeTabs = h('div.tabs.mode-tabs', [['write', 'Skriv'], ['preview', 'Forhåndsvis']].map(([k, label]) => h('button', {
    type: 'button', class: k === 'write' ? 'active' : '',
    onclick: (e) => {
      split.classList.toggle('show-write', k === 'write'); split.classList.toggle('show-preview', k === 'preview');
      modeTabs.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === e.currentTarget));
    },
  }, label)));

  // Versionshistorik
  const historyBox = h('div.stack');
  const revisions = h('div');
  function renderHistory(revs, open) {
  revisions.replaceChildren(h('details.card.history', { open },
    h('summary', icon('history', 18), ` Versionshistorik (${revs.length})`),
    revs.length ? h('ul.list', revs.map((r) => {
      let armed = false;
      const restore = h('button.btn.small.ghost', {
        type: 'button',
        onclick: async () => {
          if (!armed) { armed = true; restore.textContent = 'Klik igen for at gendanne'; return; }
          if (dirty()) await save({}, true);
          try { await api('POST', `/api/chapters/${c.id}/restore/${r.index}`); toast('Versionen er gendannet'); viewChapterEditor(c.id); }
          catch (e) { toast(e.message, true); }
        },
      }, 'Gendan');
      return h('li', h('div.row',
        h('div', h('strong', fmtDateTime(r.savedAt)), h('div.small.muted', `${r.savedBy} · ${r.words} ord · “${r.title}”`)),
        h('div.actions',
          h('button.btn.small.ghost', {
            type: 'button',
            onclick: async () => {
              const v = await api('GET', `/api/chapters/${c.id}/revisions/${r.index}`);
              historyBox.replaceChildren(h('div.card.revision-view', h('div.row', h('strong', `Version fra ${fmtDateTime(v.savedAt)}`),
                h('button.btn.small.ghost', { type: 'button', onclick: () => historyBox.replaceChildren() }, 'Luk')), h('h2', v.title), md(v.content)));
            },
          }, 'Vis'),
          restore)));
    })) : h('p.empty.small', 'Ingen tidligere versioner endnu. Hver gang du gemmer en ændring, gemmes den forrige version her.'),
    historyBox));
  }
  renderHistory(c.revisions, false);

  render(
    h('div.small', h('a', { href: `#/rediger-bog/${c.bookId}` }, `← ${c.bookTitle}`)),
    h('div.editor-head',
      titleIn,
      h('div.actions', statePill, status,
        h('a.btn.ghost', {
          href: `#/bog/${c.bookId}/${c.id}`,
          onclick: async (e) => { if (dirty()) { e.preventDefault(); if (await save({}, true)) location.hash = `#/bog/${c.bookId}/${c.id}`; } },
        }, icon('eye', 18), 'Vis som elev'),
        h('button.btn.ghost', { type: 'button', onclick: () => save() }, 'Gem'), pubBtn)),
    modeTabs, split,
    h('div.row.editor-foot', counter, h('span.small.muted', 'Ctrl/⌘+S gemmer · Ctrl/⌘+B fed · Ctrl/⌘+I kursiv · Ændringer gemmes automatisk, når du forlader siden')),
    revisions);
  updatePublish(); refresh();

  // Gem automatisk, når læreren forlader editoren med ændringer.
  const leave = () => { window.removeEventListener('hashchange', leave); if (dirty()) save({}, true); };
  window.addEventListener('hashchange', leave);
}

// h('div.card', {onclick}, children...) – bygger DOM sikkert (ingen innerHTML).
function h(tag, attrs, ...children) {
  const [name, ...classes] = tag.split('.');
  const el = document.createElement(name || 'div');
  if (classes.length) el.className = classes.join(' ');
  if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { children.unshift(attrs); attrs = null; }
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'accent') el.style.setProperty('--accent', v);
    else if (k === 'class') el.className += ' ' + v;
    else if (k in el && k !== 'list') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method, credentials: 'same-origin',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && url !== '/api/login') { state.user = null; location.hash = '#/login'; }
  if (!res.ok) throw new Error(data.error || 'Noget gik galt');
  return data;
}

function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isError ? ' error' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200);

function submitForm(form, fn, okMsg) {
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (btn) btn.disabled = true;
    try { await fn(formData(form)); if (okMsg) toast(okMsg); }

      const card = getCard();
      const form = submitForm(h('form.card.form.edit-form', h('div.small.muted', 'Redigerer'), fields(),
        h('div.actions', h('button.btn', { type: 'submit' }, 'Gem ændringer'),
          h('button.btn.ghost', { type: 'button', onclick: () => form.replaceWith(card) }, 'Annullér'))),
      onSave, okMsg);
      card.replaceWith(form);
      const first = form.querySelector('input, textarea'); if (first) first.focus();
    },
  }, icon('pencil', 16), 'Redigér');
}

// Slet med bekræftelse i selve knappen (første klik spørger, andet klik sletter).
function deleteBtn(url, after) {
  let armed = false, timer;
  const btn = h('button.btn.danger.small', {
    type: 'button',
    onclick: async () => {
      if (!armed) {
        armed = true; btn.textContent = 'Klik igen for at slette';
        timer = setTimeout(() => { armed = false; btn.textContent = 'Slet'; }, 4000);
        return;
      }
      clearTimeout(timer);
      try { await api('DELETE', url); toast('Slettet'); after(); } catch (e) { toast(e.message, true); }
    },
  }, 'Slet');
  return btn;
}

function assignmentCard(a, reload) {
  const head = h('div.row', h('h3', a.title), dueInfo(a.due));
  const desc = h('p.prewrap', a.description);
  if (isTeacher()) {
    const card = h('div.card', head, desc,
      h('div.actions',
        h('span.pill', `${a.submissionCount}/${a.studentCount} afleveret`),
        a.ungraded ? h('span.pill.warn', `${a.ungraded} til bedømmelse`) : null,
        h('a.btn.small', { href: `#/opgave/${a.id}` }, 'Se afleveringer'),
        editBtn(() => card, () => [
          h('label', 'Titel', h('input', { name: 'title', required: true, value: a.title })),
          h('label', 'Beskrivelse', h('textarea', { name: 'description', required: true, value: a.description })),
          h('label', 'Afleveringsfrist', h('input', { name: 'due', type: 'datetime-local', required: true, value: toLocalInput(a.due) })),
        ], (data) => api('PUT', `/api/assignments/${a.id}`, { ...data, due: new Date(data.due).toISOString() }).then(reload), 'Opgaven er opdateret'),
        deleteBtn(`/api/assignments/${a.id}`, reload)));
    return card;
  }
  const sub = a.mySubmission;
  if (sub && sub.grade != null) {
    return h('div.card', head, desc,
      h('div.row', h('div', h('strong', 'Din besvarelse'), h('div.small.muted', 'Afleveret ', fmtDateTime(sub.submittedAt))), h('div', h('span.muted.small', 'Karakter '), h('span.grade-big', sub.grade))),
      h('div.submission-text', sub.text),
      sub.feedback && h('p', h('strong', 'Feedback: '), sub.feedback));
  }
  const form = submitForm(h('form.form',
    h('label', sub ? 'Din besvarelse (du kan rette indtil den er bedømt)' : 'Din besvarelse',
      h('textarea', { name: 'text', required: true, value: sub ? sub.text : '' })),
    h('div.actions', h('button.btn', { type: 'submit' }, sub ? 'Opdater aflevering' : 'Aflever'),
      sub && h('span.pill.ok', `Afleveret ${fmtDateTime(sub.submittedAt)}`))),
  (data) => api('POST', `/api/assignments/${a.id}/submissions`, data).then(reload), 'Din opgave er afleveret ✔');
  return h('div.card', head, desc, form);
}

function gradebook(id) {
  const wrap = h('div.card', h('p.muted', 'Indlæser karakterbog …'));
  (async () => {
    const g = await api('GET', `/api/subjects/${id}/gradebook`);
    if (!g.assignments.length) { wrap.replaceChildren(h('p.empty', 'Ingen opgaver endnu.')); return; }
    wrap.replaceChildren(h('h2', 'Karakterbog'), h('div.table-wrap', h('table',
      h('thead', h('tr', h('th', 'Elev'), g.assignments.map((a) => h('th', h('a', { href: `#/opgave/${a.id}` }, a.title))))),
      h('tbody', g.rows.map((r) => h('tr', h('td', r.student.name),
        r.cells.map((c) => h('td.grade', c.grade != null ? c.grade : c.submitted ? h('span.pill.warn', 'Afventer') : h('span.muted', '–')))))))));
  })().catch((e) => wrap.replaceChildren(h('p.error', e.message)));
  return wrap;
}

// ---------- Lærer: bedøm afleveringer ----------
async function viewAssignment(id) {
  loading();
  const d = await api('GET', `/api/assignments/${id}/submissions`);
  const a = d.assignment;
  render(
    h('div.small', h('a', { href: `#/fag/${a.subjectId}/opgaver` }, `← ${a.subjectName}`)),
    h('div.section-title', h('div', h('h1', a.title), h('div.muted', a.subjectName)), dueInfo(a.due)),
    h('div.card', h('p.prewrap', a.description)),
    h('div.section-title', h('h2', 'Afleveringer')),
    h('div.stack', d.rows.map((r) => gradeCard(r, () => viewAssignment(id)))));
}

function gradeCard({ student, submission: sub }, reload) {
  if (!sub) return h('div.card', h('div.row', h('strong', student.name), h('span.pill.bad', 'Ikke afleveret')));
  const select = h('select', { name: 'grade', required: true },
    h('option', { value: '' }, 'Vælg karakter …'),
    state.grades.map((g) => h('option', { value: g, selected: sub.grade === g }, g)));
  const form = submitForm(h('form.form',
    h('div.grid.two', h('label', 'Karakter (7-trinsskala)', select),
      h('label', 'Feedback til eleven', h('textarea', { name: 'feedback', value: sub.feedback || '' }))),
    h('div.actions', h('button.btn', { type: 'submit' }, sub.grade != null ? 'Opdater bedømmelse' : 'Gem bedømmelse'))),
  (data) => api('POST', `/api/submissions/${sub.id}/grade`, data).then(reload), `Bedømmelse gemt for ${student.name}`);
  return h('div.card',
    h('div.row', h('div', h('strong', student.name), h('div.small.muted', 'Afleveret ', fmtDateTime(sub.submittedAt))),
      sub.grade != null ? h('span.grade-big', sub.grade) : h('span.pill.warn', 'Afventer bedømmelse')),
    h('div.submission-text', sub.text), form);
}

// ---------- Elev: karakteroversigt ----------
async function viewGrades() {
  loading();
  const d = await api('GET', '/api/dashboard');
  const numeric = d.grades.map((g) => Number(g.grade));
  const avg = numeric.length ? (numeric.reduce((a, b) => a + b, 0) / numeric.length).toFixed(1).replace('.', ',') : '–';
  render(
    h('div.section-title', h('h1', 'Mine karakterer'), h('div', h('span.muted', 'Gennemsnit '), h('span.grade-big', avg))),
    h('div.card', d.grades.length ? h('div.table-wrap', h('table',
      h('thead', h('tr', h('th', 'Fag'), h('th', 'Opgave'), h('th', 'Bedømt'), h('th', 'Karakter'), h('th', 'Feedback'))),
      h('tbody', d.grades.map((g) => h('tr',
        h('td', h('a', { href: `#/fag/${g.subjectId}/opgaver` }, g.subjectName)), h('td', g.assignmentTitle),
        h('td', fmtDate(g.gradedAt)), h('td.grade', g.grade), h('td', g.feedback || '–'))))))
      : h('p.empty', 'Du har ikke fået nogen karakterer endnu.')));
}

// ---------- Skema ----------
const WEEKDAYS = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag', 'Søndag'];
function lessonItem(l) {
  return h('li.lesson', { accent: l.color },
    h('div.row', h('div', h('strong', `${l.start}–${l.end}`), h('div', h('a', { href: `#/fag/${l.subjectId}` }, l.subjectName))),
      h('span.pill', l.subjectCode)),
    h('div.small.muted', [l.room, l.teacher].filter(Boolean).join(' · ')));
}

async function viewSchedule() {
  loading();
  const { lessons } = await api('GET', '/api/schedule');
  const today = ((new Date().getDay() + 6) % 7) + 1;
  render(
    h('div.section-title', h('h1', 'Mit skema'), h('span.muted', isTeacher() ? 'Dine lektioner' : state.user.className || '')),
    h('div.week', WEEKDAYS.slice(0, 5).map((day, i) => {
      const ls = lessons.filter((l) => l.weekday === i + 1);
      return h('div.card.day', { class: i + 1 === today ? 'today' : '' },
        h('h3', day, i + 1 === today ? h('span.pill.ok', 'I dag') : null),
        ls.length ? h('ul.list', ls.map(lessonItem)) : h('p.empty.small', 'Ingen lektioner'));
    })),
    isTeacher() ? h('p.small.muted', 'Tilføj eller fjern lektioner under fanen “Skema” i det enkelte fag.') : null);
}

function lessonFields(l) {
  return [
    h('div.grid.three',
      h('label', 'Ugedag', h('select', { name: 'weekday', required: true }, WEEKDAYS.slice(0, 5).map((d, i) => h('option', { value: i + 1, selected: l.weekday === i + 1 }, d)))),
      h('label', 'Fra', h('input', { name: 'start', type: 'time', required: true, value: l.start })),
      h('label', 'Til', h('input', { name: 'end', type: 'time', required: true, value: l.end }))),
    h('label', 'Lokale', h('input', { name: 'room', value: l.room || '', placeholder: 'f.eks. Simulatorbygningen' })),
  ];
}

function subjectSchedule(id, reload) {
  const wrap = h('div.stack', h('div.card', h('p.muted', 'Indlæser skema …')));
  (async () => {
    const { lessons } = await api('GET', '/api/schedule');
    const mine = lessons.filter((l) => l.subjectId === id);
    const list = h('div.card', h('h2', 'Ugentlige lektioner'),
      mine.length ? h('ul.list', mine.map((l) => {
        const row = h('div.row',
          h('div', h('strong', `${WEEKDAYS[l.weekday - 1]} ${l.start}–${l.end}`), h('div.small.muted', [l.room, l.teacher].filter(Boolean).join(' · '))),
          isTeacher() ? h('div.actions', editBtn(() => row, () => lessonFields(l),
            (data) => api('PUT', `/api/lessons/${l.id}`, data).then(reload), 'Lektionen er opdateret'),
          deleteBtn(`/api/lessons/${l.id}`, reload)) : null);
        return h('li', row);
      })) : h('p.empty', 'Ingen lektioner i skemaet.'));
    wrap.replaceChildren(...[
      isTeacher() && creator('Tilføj lektion', lessonFields({ weekday: 1, start: '08:15', end: '09:45', room: '' }), (data) => api('POST', `/api/subjects/${id}/lessons`, data).then(reload), 'Lektionen er tilføjet'),
      list].filter(Boolean));
  })().catch((e) => wrap.replaceChildren(h('p.error', e.message)));
  return wrap;
}

// ---------- Beskeder ----------
async function viewMessages(contactId) {
  loading();
  const { threads } = await api('GET', '/api/messages');
  if (!contactId && threads.length) contactId = (threads.find((t) => t.unread) || threads[0]).contact.id;
  const t = threads.find((x) => x.contact.id === contactId);
  if (t && t.unread) { await api('POST', `/api/messages/read/${t.contact.id}`).catch(() => {}); t.unread = 0; updateChrome(); }

  const list = h('div.card.threads', h('h2', isTeacher() ? 'Elever' : 'Lærere'),
    threads.length ? h('ul.list', threads.map((x) => h('li', { class: x.contact.id === contactId ? 'selected' : '' },
      h('a.thread', { href: `#/beskeder/${x.contact.id}` },
        h('div.row', h('strong', x.contact.name), x.unread ? h('span.badge', String(x.unread)) : null),
        h('div.small.muted', x.last ? (x.last.mine ? 'Dig: ' : '') + x.last.body.slice(0, 60) : x.subjects.join(', ')))))) : h('p.empty', 'Ingen kontakter.'));

  let convo;
  if (!t) convo = h('div.card', h('p.empty', 'Vælg en person for at skrive.'));
  else {
    const box = h('div.messages', t.messages.length ? t.messages.map((m) => h('div.msg', { class: m.mine ? 'mine' : '' },
      h('div.prewrap', m.body), h('div.small.meta', fmtDateTime(m.createdAt)))) : h('p.empty', 'Ingen beskeder endnu – skriv den første.'));
    const form = submitForm(h('form.form.compose',
      h('textarea', { name: 'body', required: true, placeholder: `Skriv til ${t.contact.name} …` }),
      h('div.actions', h('button.btn', { type: 'submit' }, 'Send'))),
    (data) => api('POST', '/api/messages', { toId: t.contact.id, body: data.body }).then(() => viewMessages(t.contact.id)), 'Besked sendt');
    convo = h('div.card.convo',
      h('div', h('h2', t.contact.name), h('div.small.muted', [t.contact.role === 'teacher' ? 'Lærer' : t.contact.className, t.subjects.join(', ')].filter(Boolean).join(' · '))),
      box, form);
    setTimeout(() => { box.scrollTop = box.scrollHeight; }, 0);
  }
  render(h('div.section-title', h('h1', 'Beskeder')), h('div.msg-layout', list, convo));
}

// ---------- Router ----------
async function router() {
  const hash = location.hash || '#/';
  if (!state.user) {
    updateChrome();
    if (hash !== '#/login') location.hash = '#/login'; else viewLogin();
    return;
  }
  if (hash === '#/login') { location.hash = '#/'; return; }
  updateChrome();
  const parts = hash.slice(2).split('/').filter(Boolean);
  try {
    if (!parts.length) await viewDashboard();
    else if (parts[0] === 'fag' && parts[1]) await viewSubject(parts[1], parts[2]);
    else if (parts[0] === 'fag') await viewSubjects();
    else if (parts[0] === 'opgave' && parts[1] && isTeacher()) await viewAssignment(parts[1]);
    else if (parts[0] === 'karakterer' && !isTeacher()) await viewGrades();
    else if (parts[0] === 'skema') await viewSchedule();
    else if (parts[0] === 'beskeder') await viewMessages(parts[1]);
    else if (parts[0] === 'boeger') await viewLibrary();
    else if (parts[0] === 'bog' && parts[1]) await viewBook(parts[1], parts[2]);
    else if (parts[0] === 'rediger-bog' && parts[1] && isTeacher()) await viewBookEditor(parts[1]);
    else if (parts[0] === 'rediger-kapitel' && parts[1] && isTeacher()) await viewChapterEditor(parts[1]);
    else if (parts[0] === 'studio' && isTeacher()) await viewStudio();
    else render(h('div.card', h('h1', 'Siden findes ikke'), h('a', { href: '#/' }, 'Til forsiden')));
  } catch (e) {
    render(h('div.card', h('h2', 'Der opstod en fejl'), h('p.error', e.message), h('a', { href: '#/' }, 'Til forsiden')));
  }
}

async function boot(target) {
  try { const me = await api('GET', '/api/me'); state.user = me.user; state.grades = me.grades; }
  catch { state.user = null; }
  if (target && location.hash !== target) location.hash = target; else router();
}
window.addEventListener('hashchange', router);
boot();

// Installérbar app (PWA) – kun når portalen kører fra serveren, ikke i demo-filen.
if (!window.PORTAL_DEMO && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
