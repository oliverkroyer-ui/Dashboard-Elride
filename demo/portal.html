// ---------- Eksport til PDF ----------
// PDF'en bygges i browseren med jsPDF ud fra den udgivne version (eller kladden).
const PDF_MAP = { 'Δ': 'Delta', 'θ': 'theta', 'ρ': 'rho', 'λ': 'lambda', 'φ': 'phi', 'μ': 'my', '₀': '0', '₁': '1', '₂': '2', '−': '-', '·': '*', '≤': '<=', '≥': '>=', '√': 'sqrt', '→': '->', '←': '<-', '❝': '"', '✔': '', '⋯': '...', ' ': ' ' };
const pdfSafe = (s) => String(s).replace(/[^\x20-\x7e -ÿ–—‘’“”…€\n]/g, (c) => (PDF_MAP[c] != null ? PDF_MAP[c] : ''));
async function exportPdf(bookId, opts = {}) {
  toast('Laver PDF …');
  try {
    const qs = opts.draft ? '?draft=1' : opts.edition ? `?edition=${opts.edition}` : '';
    const [d] = await Promise.all([api('GET', `/api/books/${bookId}/export${qs}`), loadScript(LIB.jspdf)]);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, M = 20, CW = W - 2 * M, BOTTOM = 280;
    let y = M;
    const page = () => { doc.addPage(); y = M + 6; };
    const need = (hgt) => { if (y + hgt > BOTTOM) page(); };
    const text = (s, size = 10.5, style = 'normal', indent = 0, gap = 1.6) => {
      doc.setFont('helvetica', style); doc.setFontSize(size);
      for (const line of doc.splitTextToSize(pdfSafe(s), CW - indent)) { need(size * 0.45); doc.text(line, M + indent, y); y += size * 0.45; }
      y += gap;
    };
    // Forside
    doc.setFillColor(11, 46, 79); doc.rect(0, 0, W, 90, 'F');
    doc.setTextColor(242, 193, 78); doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(pdfSafe('ROHUB · MARSTAL NAVIGATIONSSKOLE · ' + (d.subject || '').toUpperCase()), M, 30);
    doc.setTextColor(255, 255, 255); doc.setFontSize(28); doc.text(doc.splitTextToSize(pdfSafe(d.title), CW), M, 50);
    doc.setTextColor(30, 40, 50); doc.setFont('helvetica', 'normal'); doc.setFontSize(12);
    y = 110; if (d.description) text(d.description, 12);
    text(`${d.label} · ${d.author}`, 10, 'normal'); text(`Udskrevet ${new Date().toLocaleDateString('da-DK')}`, 9);
    // Indholdsfortegnelse
    page(); text('Indhold', 18, 'bold', 0, 4);
    for (const c of d.chapters) text(`${c.number}  ${c.title}`, 11, c.parentId ? 'normal' : 'bold', c.parentId ? 8 : 0, 0.8);
    // Kapitler
    const formulaLines = (f) => {
      let expr = f.expression; try { expr = PortalFormula.show(PortalFormula.parse(f.expression), (n) => (f.variables.find((v) => v.symbol === n) || {}).display || n); } catch (e) { /* rå */ }
      return [`${f.result.display || f.result.symbol} = ${expr}`, ...f.variables.map((v) => `   ${v.display || v.symbol}: ${v.label || ''}${v.unit ? ' [' + v.unit + ']' : ''}`)];
    };
    const sourcesUsed = new Map();
    for (const c of d.chapters) {
      page();
      text(`${c.number}  ${c.title}`, c.parentId ? 15 : 18, 'bold', 0, 3);
      const resolved = c.content.replace(/\{\{(fakta|formel|kilde):([A-Za-z0-9_-]+)\}\}/g, (all, kind, key) => {
        if (kind === 'fakta') { const f = d.refs.facts[key]; return f ? `${f.value}${f.unit ? ' ' + f.unit : ''}` : all; }
        if (kind === 'kilde') { const s = d.refs.sources[key]; if (s) sourcesUsed.set(key, s); return s ? `(${s.source} ${s.ref})` : all; }
        return `\n\n@@FORMEL:${key}@@\n\n`;
      });
      const el = md(resolved);
      for (const node of el.children) {
        const tag = node.nodeName;
        const fm = /^@@FORMEL:([\w-]+)@@$/.exec(node.textContent.trim());
        if (fm) {
          const f = d.refs.formulas[fm[1]]; if (!f) continue;
          const lines = formulaLines(f);
          need(8 + lines.length * 5);
          doc.setDrawColor(19, 74, 122); doc.setFillColor(238, 244, 250);
          doc.roundedRect(M, y - 4, CW, 7 + lines.length * 5, 2, 2, 'FD');
          text(`Formel: ${f.name}`, 10.5, 'bold', 3, 0.5);
          lines.forEach((l, i) => text(l, i ? 9.5 : 11, i ? 'normal' : 'bold', 3, 0.3));
          y += 4; continue;
        }
        if (/^H[2-5]$/.test(tag)) { y += 2; text(node.textContent, tag === 'H2' ? 14 : 12, 'bold', 0, 1.5); }
        else if (tag === 'UL' || tag === 'OL') [...node.children].forEach((li, i) => text(`${tag === 'OL' ? i + 1 + '.' : '•'}  ${li.textContent}`, 10.5, 'normal', 4, 0.8));
        else if (tag === 'BLOCKQUOTE') { doc.setDrawColor(242, 193, 78); doc.setLineWidth(1); const y0 = y - 3; text(node.textContent, 10.5, 'italic', 5, 1); doc.line(M + 1, y0, M + 1, y - 2); doc.setLineWidth(0.2); }
        else if (tag === 'PRE') text(node.textContent, 9.5, 'normal', 4);
        else if (tag === 'HR') { need(4); doc.line(M, y, W - M, y); y += 4; }
        else if (node.querySelector && node.querySelector('table')) {
          for (const tr of node.querySelectorAll('tr')) { const cells = [...tr.children].map((td) => td.textContent.trim()); text(cells.join('   |   '), 10, tr.parentNode.nodeName === 'THEAD' ? 'bold' : 'normal', 2, 0.6); }
          y += 2;
        } else text(node.textContent, 10.5);
      }
    }
    if (sourcesUsed.size) {
      page(); text('Retskilder', 18, 'bold', 0, 4);
      for (const s of sourcesUsed.values()) { text(`${s.source} ${s.ref}${s.title ? ' – ' + s.title : ''}`, 11, 'bold', 0, 0.5); text(s.text, 10); if (s.url) text(s.url, 8.5); }
    }
    // Sidehoved og -fod
    const n = doc.getNumberOfPages();
    for (let i = 2; i <= n; i++) {
      doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(110, 120, 130);
      doc.text(pdfSafe(`${d.title} · ${d.label}`), M, 12); doc.text(`Side ${i} af ${n}`, W - M, 290, { align: 'right' }); doc.text('Rohub · Marstal Navigationsskole', M, 290);
      doc.setTextColor(30, 40, 50);
    }
    const filename = `${d.title.replace(/[^\wæøåÆØÅ -]+/g, '').trim() || 'bog'} ${opts.draft ? 'kladde' : d.label.split(' ·')[0]}.pdf`;
    const blob = doc.output('blob');
    await offerDownload(filename, blob);
  } catch (e) { toast(e.message, true); }
}
// Gem en fil: i demoen via Claude-visningens download-funktion, ellers som et almindeligt link
async function offerDownload(filename, blob) {
  if (window.PORTAL_DEMO && window.claude && window.claude.use) {
    const dl = await window.claude.use('downloads');
    if (!dl) throw new Error('Download er ikke tilgængelig i denne visning');
    try { await dl.save({ filename, data: blob }); toast('PDF er gemt'); }
    catch (e) { if (e.code !== 'declined') throw new Error('Kunne ikke gemme filen (' + (e.code || 'fejl') + ')'); }
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('PDF er hentet');
}

'use strict';

// Kør en AI-opgave: i demoen direkte fra browseren via Claude-visningen, ellers via serveren.
async function aiRun(task, input) {
  if (window.PORTAL_DEMO) {
    const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
    if (!sample) throw new Error('AI er ikke tilgængelig i denne visning. Åbn portalen i Claude for at bruge AI-forslag.');
    if (task === 'fri') input = { ...input, context: (await api('GET', '/api/ai/context')).context };
    const p = window.PortalPrompts[task](input);
    try {
      return await sample.json(`${p.system}\n\n${p.prompt}\n\nSvar udelukkende med JSON, der passer til dette skema:\n${JSON.stringify(p.schema)}`, { modelTier: 'default' });
    } catch (e) {
      const msg = { not_granted: 'Du har ikke givet portalen lov til at bruge Claude.', rate_limited: 'Claude er travlt optaget – prøv igen om lidt.' }[e.code];
      throw new Error(msg || 'AI kunne ikke svare: ' + (e.message || e.code));
    }
  }
  return api('POST', '/api/ai', { task, input });
}
async function aiAvailable() {
  if (window.PORTAL_DEMO) return !!(window.claude && window.claude.use && await window.claude.use('sample'));
  try { return (await api('GET', '/api/ai/status')).server; } catch { return false; }
}

// ---------- Hjælpere ----------
// h('div.card', {onclick}, children...) – bygger DOM sikkert (ingen innerHTML).
function h(tag, attrs, ...children) {
  const [name, ...classes] = tag.split('.');
  const el = document.createElement(name || 'div');
  if (classes.length) el.className = classes.join(' ');
  if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { children.unshift(attrs); attrs = null; }
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'accent') el.style.setProperty('--accent', v);
    else if (k === 'class') el.className += ' ' + v;
    else if (k in el && k !== 'list') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method, credentials: 'same-origin',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && url !== '/api/login') { state.user = null; location.hash = '#/login'; }
  if (!res.ok) throw new Error(data.error || 'Noget gik galt');
  return data;
}

let toastTimer;
function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isError ? ' error' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200);
}

  const d = Math.ceil((new Date(iso) - Date.now()) / 86400000);
  if (d < 0) return h('span.pill.bad', `Overskredet (${fmtDate(iso)})`);
  if (d <= 3) return h('span.pill.warn', d === 0 ? 'Afleveres i dag' : `Om ${d} dag${d === 1 ? '' : 'e'}`);

function submitForm(form, fn, okMsg) {
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    if (btn) btn.disabled = true;
    try { await fn(formData(form), form); if (okMsg) toast(okMsg); }

    finally { if (btn) btn.disabled = false; }
  });
  return form;
}

function creator(title, fields, onSubmit, okMsg) {

// Redigér: byt et kort ud med en formular og tilbage igen.
const toLocalInput = (iso) => { const d = new Date(iso); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
function editBtn(getCard, fields, onSave, okMsg) {
  return h('button.btn.small.ghost', {
    type: 'button',
    onclick: () => {
      const card = getCard();
      const form = submitForm(h('form.card.form.edit-form', h('div.small.muted', 'Redigerer'), fields(),
        h('div.actions', h('button.btn', { type: 'submit' }, 'Gem ændringer'),
          h('button.btn.ghost', { type: 'button', onclick: () => form.replaceWith(card) }, 'Annullér'))),
      onSave, okMsg);
      card.replaceWith(form);
      const first = form.querySelector('input, textarea'); if (first) first.focus();
    },
  }, icon('pencil', 16), 'Redigér');
}

// Slet med bekræftelse i selve knappen (første klik spørger, andet klik sletter).
function deleteBtn(url, after) {
  let armed = false, timer;
  const btn = h('button.btn.danger.small', {
    type: 'button',
    onclick: async () => {
      if (!armed) {
        armed = true; btn.textContent = 'Klik igen for at slette';
        timer = setTimeout(() => { armed = false; btn.textContent = 'Slet'; }, 4000);
        return;
      }
      clearTimeout(timer);
      try { await api('DELETE', url); toast('Slettet'); after(); } catch (e) { toast(e.message, true); }
    },
  }, 'Slet');
  return btn;
}

async function viewMessages(contactId) {
  loading();
  const { threads } = await api('GET', '/api/messages');
  if (!contactId && threads.length) contactId = (threads.find((t) => t.unread) || threads[0]).contact.id;
  const t = threads.find((x) => x.contact.id === contactId);
  if (t && t.unread) { await api('POST', `/api/messages/read/${t.contact.id}`).catch(() => {}); t.unread = 0; updateChrome(); }

  const list = h('div.card.threads', h('h2', isTeacher() ? 'Elever' : 'Lærere'),
    threads.length ? h('ul.list', threads.map((x) => h('li', { class: x.contact.id === contactId ? 'selected' : '' },
      h('a.thread', { href: `#/beskeder/${x.contact.id}` },
        h('div.row', h('strong', x.contact.name), x.unread ? h('span.badge', String(x.unread)) : null),
        h('div.small.muted', x.last ? (x.last.mine ? 'Dig: ' : '') + x.last.body.slice(0, 60) : x.subjects.join(', ')))))) : h('p.empty', 'Ingen kontakter.'));

  let convo;
  if (!t) convo = h('div.card', h('p.empty', 'Vælg en person for at skrive.'));
  else {
    const box = h('div.messages', t.messages.length ? t.messages.map((m) => h('div.msg', { class: m.mine ? 'mine' : '' },
      h('div.prewrap', m.body), h('div.small.meta', fmtDateTime(m.createdAt)))) : h('p.empty', 'Ingen beskeder endnu – skriv den første.'));
    const form = submitForm(h('form.form.compose',
      h('textarea', { name: 'body', required: true, placeholder: `Skriv til ${t.contact.name} …` }),
      h('div.actions', h('button.btn', { type: 'submit' }, 'Send'))),
    (data) => api('POST', '/api/messages', { toId: t.contact.id, body: data.body }).then(() => viewMessages(t.contact.id)), 'Besked sendt');
    convo = h('div.card.convo',
      h('div', h('h2', t.contact.name), h('div.small.muted', [t.contact.role === 'teacher' ? 'Lærer' : t.contact.className, t.subjects.join(', ')].filter(Boolean).join(' · '))),
      box, form);
    setTimeout(() => { box.scrollTop = box.scrollHeight; }, 0);
  }
  render(h('div.section-title', h('h1', 'Beskeder')), h('div.msg-layout', list, convo));
}

  if (!state.user) {
    updateChrome();
    if (hash !== '#/login') location.hash = '#/login'; else viewLogin();
    return;
  }
  if (hash === '#/login') { location.hash = '#/'; return; }
  updateChrome();
  const parts = hash.split('?')[0].slice(2).split('/').filter(Boolean);
  try {
    if (!parts.length) await viewDashboard();
    else if (parts[0] === 'fag' && parts[1]) await viewSubject(parts[1], parts[2]);
    else if (parts[0] === 'fag') await viewSubjects();
    else if (parts[0] === 'opgave' && parts[1] && isTeacher()) await viewAssignment(parts[1]);
    else if (parts[0] === 'karakterer' && !isTeacher()) await viewGrades();
    else if (parts[0] === 'skema') await viewSchedule();
    else if (parts[0] === 'beskeder') await viewMessages(parts[1]);
    else if (parts[0] === 'boeger') await viewLibrary();
    else if (parts[0] === 'bog' && parts[1]) await viewBook(parts[1], parts[2]);
    else if (parts[0] === 'rediger-bog' && parts[1] && isTeacher()) await viewBookEditor(parts[1]);
    else if (parts[0] === 'rediger-kapitel' && parts[1] && isTeacher()) await viewChapterEditor(parts[1]);
    else if (parts[0] === 'studio' && isTeacher()) await viewTeacherDashboard();
    else if (parts[0] === 'udgiv' && parts[1] && isTeacher()) await viewPublish(parts[1]);
    else if (parts[0] === 'aendringer' && parts[1]) await viewChanges(parts[1]);
    else if (parts[0] === 'importer' && parts[1] && isTeacher()) await viewImport(parts[1]);
    else if (parts[0] === 'formler' && parts[1] && isTeacher()) await viewFormulaEditor(parts[1]);
    else if (parts[0] === 'formler' && isTeacher()) await viewFormulaLibrary();
    else if (parts[0] === 'formelsamling') await viewFormulaCollection();
    else if (parts[0] === 'lovaendringer' && parts[1] && isTeacher()) await viewLegalChange(parts[1]);
    else if (parts[0] === 'lovaendringer' && isTeacher()) await viewLegal();
    else if (parts[0] === 'dokumentation' && isTeacher()) await viewLegalLog();
    else if (parts[0] === 'oplysninger' && isTeacher()) await viewFacts();
    else if (parts[0] === 'kilder' && isTeacher()) await viewSources();
    else if (parts[0] === 'assistent' && isTeacher()) await viewAssistant();
    else if (parts[0] === 'admin' && isTeacher()) await viewAdmin(parts[1]);
    else if (parts[0] === 'soeg') await viewSearch();
    else if (parts[0] === 'mine-noter') await viewMyNotes();
    else if (parts[0] === 'notifikationer') await viewNotifications();
    else if (parts[0] === 'mere') viewMore();
    else render(h('div.card', h('h1', 'Siden findes ikke'), h('a', { href: '#/' }, 'Til forsiden')));
  } catch (e) {
    render(h('div.card', h('h2', 'Der opstod en fejl'), h('p.error', e.message), h('a', { href: '#/' }, 'Til forsiden')));
  }
}

async function boot(target) {
  try { const me = await api('GET', '/api/me'); state.user = me.user; state.grades = me.grades; }
  catch { state.user = null; }
  if (target && location.hash !== target) location.hash = target; else router();
}
document.getElementById('bell').addEventListener('click', () => { location.hash = '#/notifikationer'; });
window.addEventListener('hashchange', router);
boot();

// Installérbar app (PWA) – kun når portalen kører fra serveren, ikke i demo-filen.
if (!window.PORTAL_DEMO && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}

</script>
